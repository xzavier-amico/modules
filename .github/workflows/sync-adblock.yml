name: sync-adblock

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 同步 MetaCubeX 与秋风规则
        run: node scripts/sync-adblock.js

      - name: 校验构建产物
        run: node scripts/build.js --check

      - name: 提交并推送
        run: |
          if git diff --quiet; then
            echo "规则没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md loon egern shadowrocket
          git commit -m "chore(adblock): 同步 MetaCubeX 与秋风规则"
          git push
