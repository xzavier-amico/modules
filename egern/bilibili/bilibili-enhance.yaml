  dynamic_ad_card:
    name: "[动态] 去除广告卡片"
    description: "是否启用此处修改"
    options: ["true", "false"]
  dynamic_personal_ad_card:
    name: "[动态] 去除个人流广告卡片"
    description: "过滤DynAllPersonal与DynVideoPersonal中的cardType=15；当前抓包尚无广告阳性样本。"
    options: ["true", "false"]
  view_ad:
    name: "[视频] 去除播放页广告"
    description: "是否启用此处修改"
    options: ["true", "false"]
  dm_command:
    name: "[弹幕] 去除交互式弹幕"
    description: "是否启用此处修改"
    options: ["true", "false"]
  dm_colorful:
    name: "[弹幕] 替换彩色弹幕"
    description: "是否启用此处修改"
    options: ["true", "false"]
  dm_airborne:
    name: "[弹幕] 空降助手"
    description: "是否启用此处修改"
    options: ["true", "false"]
  reply_ad:
    name: "[评论] 去除广告"
    description: "是否启用此处修改"
    options: ["true", "false"]
  reply_commercial_links:
    name: "[评论] 禁用普通评论商业跳转"
    description: "保留普通评论正文与回复树，仅移除已识别商品链接的可点击映射。"
    options: ["true", "false"]
  reply_subject_description_commercial:
    name: "[评论] 隐藏编辑器商品能力"
    description: "移除SubjectDescription中的商品与商业助手按钮(type 5/8)；当前抓包中它们均为隐藏状态。"
    options: ["true", "false"]
  privacy_tracking:
    name: "[隐私] 移除响应链接跟踪参数"
    description: "清理推荐、Story 与评论跳转链接中的高置信度归因参数，保留目标和界面功能参数。"
    options: ["true", "false"]
  privacy_block_bili_commercial:
    name: "[隐私] 阻止B站商业上报"
    description: "本地成功响应conversion/mobile/v2与fees/wise，阻止相关请求上传。"
    options: ["true", "false"]
  privacy_block_third_party:
    name: "[隐私] 阻止第三方广告归因"
    description: "本地响应已确认的千问与Solar Engine广告展示、点击和归因请求。"
    options: ["true", "false"]
  privacy_strict:
    name: "[隐私] 严格模式"
    description: "同时启用响应跟踪清理、商业链接与上报阻断，并移除直播show/click callback；可能影响跳转、推荐和翻页。"
    options: ["true", "false"]

scriptings:
  # PreferencePanes.API
  - http_request:
      name: "biliverse.enhanced.1"
      match: "^https:\\/\\/(?:biliverse\\.github\\.io|app\\.bilibili\\.com)\\/api\\/(?:get|set|delete)(?:\\?.*)?$"
      script_url: "https://github.com/NSNanoCat/PreferencePanes/releases/latest/download/api.js"
      body_required: true
      max_size: 33554432
      timeout: 60

  # 📺 Biliverse.Enhanced.x.resource.show.tab.v2
  - http_response:
      name: "biliverse.enhanced.2"
      match: "^https?:\\/\\/app\\.bili(bili\\.com|api\\.net)\\/x\\/resource\\/show\\/tab\\/v2\\?"
      script_url: "https://github.com/Biliverse/Enhanced/releases/download/v0.6.2/response.bundle.js"
      body_required: true
      max_size: 33554432
      timeout: 60
      env:
        _compat.$argument: '{"Home.Switch":{{{home_switch}}},"Home.Tab":"{{{home_tab}}}","Home.Tab_default":"{{{home_tab_default}}}","Home.Top_left":"{{{home_top_left}}}","Home.Top":"{{{home_top}}}","Home.Top_more":"{{{home_top_more}}}","Bottom":"{{{bottom}}}","Region.Switch":{{{region_switch}}},"Mine.Switch":{{{mine_switch}}},"Mine.iPad.Switch":{{{mine_i_pad_switch}}},"Storage":"{{{storage}}}","LogLevel":"{{{log_level}}}"}'

  # 📺 Biliverse.Enhanced.show.v1.Mixture.RegionShortcut.request.grpc
  - http_request:
      name: "biliverse.enhanced.3"
      match: "^https?:\\/\\/(grpc|app)\\.bili(bili\\.com|api\\.net)\\/bilibili\\.app\\.show\\.v1\\.Mixture\\/RegionShortcut$"
      script_url: "https://github.com/Biliverse/Enhanced/releases/download/v0.6.2/request.bundle.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 60
      env:
        _compat.$argument: '{"Home.Switch":{{{home_switch}}},"Home.Tab":"{{{home_tab}}}","Home.Tab_default":"{{{home_tab_default}}}","Home.Top_left":"{{{home_top_left}}}","Home.Top":"{{{home_top}}}","Home.Top_more":"{{{home_top_more}}}","Bottom":"{{{bottom}}}","Region.Switch":{{{region_switch}}},"Mine.Switch":{{{mine_switch}}},"Mine.iPad.Switch":{{{mine_i_pad_switch}}},"Storage":"{{{storage}}}","LogLevel":"{{{log_level}}}"}'

  # 📺 Biliverse.Enhanced.show.v1.Mixture.RegionList.response.grpc
  - http_response:
      name: "biliverse.enhanced.4"
      match: "^https?:\\/\\/(grpc|app)\\.bili(bili\\.com|api\\.net)\\/bilibili\\.app\\.show\\.v1\\.Mixture\\/RegionList$"
      script_url: "https://github.com/Biliverse/Enhanced/releases/download/v0.6.2/response.bundle.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 60
      env:
        _compat.$argument: '{"Home.Switch":{{{home_switch}}},"Home.Tab":"{{{home_tab}}}","Home.Tab_default":"{{{home_tab_default}}}","Home.Top_left":"{{{home_top_left}}}","Home.Top":"{{{home_top}}}","Home.Top_more":"{{{home_top_more}}}","Bottom":"{{{bottom}}}","Region.Switch":{{{region_switch}}},"Mine.Switch":{{{mine_switch}}},"Mine.iPad.Switch":{{{mine_i_pad_switch}}},"Storage":"{{{storage}}}","LogLevel":"{{{log_level}}}"}'

  # 📺 Biliverse.Enhanced.x.v2.account.mine
  - http_response:
      name: "biliverse.enhanced.5"
      match: "^https?:\\/\\/app\\.bili(bili\\.com|api\\.net)\\/x\\/v2\\/account\\/mine(\\/ipad)?\\?"
      script_url: "https://github.com/Biliverse/Enhanced/releases/download/v0.6.2/response.bundle.js"
      body_required: true
      max_size: 33554432
      timeout: 60
      env:
        _compat.$argument: '{"Home.Switch":{{{home_switch}}},"Home.Tab":"{{{home_tab}}}","Home.Tab_default":"{{{home_tab_default}}}","Home.Top_left":"{{{home_top_left}}}","Home.Top":"{{{home_top}}}","Home.Top_more":"{{{home_top_more}}}","Bottom":"{{{bottom}}}","Region.Switch":{{{region_switch}}},"Mine.Switch":{{{mine_switch}}},"Mine.iPad.Switch":{{{mine_i_pad_switch}}},"Storage":"{{{storage}}}","LogLevel":"{{{log_level}}}"}'

  # 📺 Biliverse.Enhanced.x.v2.region.index
  - http_response:
      name: "biliverse.enhanced.6"
      match: "^https?:\\/\\/app\\.bili(bili\\.com|api\\.net)\\/x\\/v2\\/region\\/index\\?"
      script_url: "https://github.com/Biliverse/Enhanced/releases/download/v0.6.2/response.bundle.js"
      body_required: true
      max_size: 33554432
      timeout: 60
      env:
        _compat.$argument: '{"Home.Switch":{{{home_switch}}},"Home.Tab":"{{{home_tab}}}","Home.Tab_default":"{{{home_tab_default}}}","Home.Top_left":"{{{home_top_left}}}","Home.Top":"{{{home_top}}}","Home.Top_more":"{{{home_top_more}}}","Bottom":"{{{bottom}}}","Region.Switch":{{{region_switch}}},"Mine.Switch":{{{mine_switch}}},"Mine.iPad.Switch":{{{mine_i_pad_switch}}},"Storage":"{{{storage}}}","LogLevel":"{{{log_level}}}"}'

  # 📺 Biliverse.Enhanced.x.v2.channel.region.list
  - http_response:
      name: "biliverse.enhanced.7"
      match: "^https?:\\/\\/app\\.bili(bili\\.com|api\\.net)\\/x\\/v2\\/channel\\/region\\/list\\?"
      script_url: "https://github.com/Biliverse/Enhanced/releases/download/v0.6.2/response.bundle.js"
      body_required: true
      max_size: 33554432
      timeout: 60
      env:
        _compat.$argument: '{"Home.Switch":{{{home_switch}}},"Home.Tab":"{{{home_tab}}}","Home.Tab_default":"{{{home_tab_default}}}","Home.Top_left":"{{{home_top_left}}}","Home.Top":"{{{home_top}}}","Home.Top_more":"{{{home_top_more}}}","Bottom":"{{{bottom}}}","Region.Switch":{{{region_switch}}},"Mine.Switch":{{{mine_switch}}},"Mine.iPad.Switch":{{{mine_i_pad_switch}}},"Storage":"{{{storage}}}","LogLevel":"{{{log_level}}}"}'

  # 📺 BiliBili.Global.bangumi.play.html
  - http_request:
      name: "biliverse.global.8"
      match: "^https?:\\/\\/www\\.bilibili\\.com\\/bangumi\\/play\\/(ss|ep)\\d+\\/?"
      script_url: "https://github.com/Biliverse/Global/releases/download/v0.9.3/request.bundle.js"
      body_required: true
      max_size: 33554432
