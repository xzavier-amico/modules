#=======================================================================================
# BiliBili Biliverse — Enhanced + Global + Redirect + ADBlock (merged) — Egern 模块
#
# 由 Biliverse 的 4 个 Surge 模块合并转换而来：
#   Enhanced (v0.6.2) / Global (v0.9.3) / Redirect (v0.2.25) / ADBlock (v0.7.5)
# 脚本直接引用上游 GitHub Releases 的 bundle.js（绝对 URL），无需本地托管。
#=======================================================================================

name: "BiliBili Biliverse (Enhanced+Global+Redirect+ADBlock)"
description: "哔哩哔哩：增强 + 全球 + 重定向 + 去广告 合并模块。"
author: "VirgilClyne et al."
homepage: "https://biliverse.github.io/guide/"
icon: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/bilibili/icon/icon.png"

# ---- 参数（snake_case；Surge 原始键名通过 {{{...}}} 注入到 argument JSON）----
compat_arguments:
  home_switch: "true"
  home_tab: "2036,2037,780,545,151"
  home_tab_default: "2037"
  home_top_left: "mine"
  home_top: "messages"
  home_top_more: "categories,search"
  bottom: "home,dynamic,ogv,mall,mine"
  region_switch: "true"
  mine_switch: "true"
  mine_i_pad_switch: "true"
  storage: "PersistentStore"
  log_level: "WARN"
  force_host: "1"
  locales: "CHN,HKG,TWN"
  proxies_chn: "DIRECT"
  proxies_hkg: "🇭🇰香港"
  proxies_mac: "🇲🇴澳门"
  proxies_twn: "🇹🇼台湾"
  host_oversea_video: "upos-sz-mirrorali.bilivideo.com"
  host_b_star: "upos-sz-mirrorali.bilivideo.com"
  host_pcdn: "upos-sz-mirrorali.bilivideo.com"
  host_mcdn: "proxy-tf-all-ws.bilivideo.com"
  splash: "true"
  feed_ad: "true"
  feed_activity: "false"
  feed_vertical: "false"
  feed_block_up_live_list: ""
  feed_story: "true"
  feed_story_commercial: "true"
  search_ad: "true"
  search_tracking: "false"
  search_hot_search: "true"
  pgc_ad: "true"
  xlive_ad: "true"
  xlive_remove_tracking_callbacks: "false"
  xlive_remove_preload_tracking: "false"
  dynamic_hot_topics: "true"
  dynamic_most_visited: "false"
  dynamic_most_visited_live_only: "false"
  dynamic_ad_card: "true"
  dynamic_personal_ad_card: "false"
  view_ad: "true"
  dm_command: "false"
  dm_colorful: "false"
  dm_airborne: "false"
  reply_ad: "true"
  reply_commercial_links: "false"
  reply_subject_description_commercial: "false"
  privacy_tracking: "true"
  privacy_block_bili_commercial: "false"
  privacy_block_third_party: "false"
  privacy_strict: "false"

compat_arguments_schema:
  home_switch:
    name: "[首页] 启用自定义功能"
    description: "启用后可自定义首页顶栏、标签页和底部导航栏内容。标签页由分区页的快捷访问决定。"
    options: ["true", "false"]
  home_tab:
    name: "[首页] 标签页"
    description: "这里只列出常用选项；分区页提供接近60个快捷访问选项，无法在模块参数中完整列出。请前往 BiliBili App 分区页，使用原生“快捷访问”功能自定义首页标签页。"
    options: []
  home_tab_default:
    name: "[首页] 默认标签页"
    description: "请选择启动APP时默认展示的标签页，需先将该标签页加入分区页的快捷访问。"
    options: ["2037", "2036", "780", "545", "774", "151", "801", "2280"]
  home_top_left:
    name: "[首页] 顶栏（左侧）按钮（用户头像）"
    description: "请选择顶栏（左侧）按钮（用户头像）的作用（在biliBili粉色版中无法修改）。"
    options: ["mine", "videoshortcut"]
  home_top:
    name: "[首页] 顶栏（右侧）按钮"
    description: "请选择启用的顶栏（右侧）按钮。"
    options: []
  home_top_more:
    name: "[首页] 标签栏右侧按钮"
    description: "请选择启用的首页标签栏右侧按钮。"
    options: []
  bottom:
    name: "[底部] 导航栏按钮"
    description: "请选择启用的底部导航栏按钮，最多6个。"
    options: []
  region_switch:
    name: "[分区] 启用此标签页自定义功能"
    description: "启用后可自定义分区标签页的内容。"
    options: ["true", "false"]
  mine_switch:
    name: "[我的] 启用此标签页自定义功能"
    description: "启用后可自定义我的标签页的服务内容。"
    options: ["true", "false"]
  mine_i_pad_switch:
    name: "[我的 iPad版] 启用此标签页自定义功能"
    description: "启用后可自定义iPad版我的标签页的服务内容。"
    options: ["true", "false"]
  storage:
    name: "[储存] 配置类型"
    description: "默认使用 PersistentStore，配置优先级为 database -> $argument -> PersistentStore (BoxJs)；选择 Argument 时为 database -> PersistentStore (BoxJs) -> $argument。"
    options: ["PersistentStore", "Argument", "database"]
  log_level:
    name: "[调试] 日志等级"
    description: "选择脚本日志的输出等级，低于所选等级的日志将全部输出。"
    options: ["WARN", "OFF", "ERROR", "INFO", "DEBUG", "ALL"]
  force_host:
    name: "强制CDN主机名类型"
    description: "请设置强制返回的CDN主机名类型。"
    options: ["1", "0", "2"]
  locales:
    name: "启用自动识别与分流功能的地区"
    description: "请选择启用自动识别与分流功能的地区。"
    options: []
  proxies_chn:
