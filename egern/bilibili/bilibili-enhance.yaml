  host_b_star:
    name: "[主机名] 重定向 BStar CDN (国际版)"
    description: "请选择 BStar 要重定向的主机名。"
    options: ["upos-sz-mirrorali.bilivideo.com", "upos-sz-mirrorcos.bilivideo.com", "upos-sz-mirrorhw.bilivideo.com", "upos-sz-mirrorhwo1.bilivideo.com", "upos-sz-mirror08c.bilivideo.com", "upos-sz-mirroraliov.bilivideo.com", "upos-sz-mirrorcosov.bilivideo.com", "upos-sz-mirrorhwov.bilivideo.com", "cn-hk-eq-01-01.bilivideo.com", "cn-hk-eq-01-03.bilivideo.com", "cn-hk-eq-01-09.bilivideo.com", "cn-hk-eq-01-10.bilivideo.com", "cn-hk-eq-01-12.bilivideo.com", "cn-hk-eq-01-13.bilivideo.com", "cn-hk-eq-01-14.bilivideo.com"]
  host_pcdn:
    name: "[主机名] 重定向 PCDN 主机名 (中国大陆)"
    description: "请选择 PCDN 要重定向的主机名。"
    options: ["upos-sz-mirrorali.bilivideo.com", "upos-sz-mirrorcos.bilivideo.com", "upos-sz-mirrorhw.bilivideo.com", "upos-sz-mirrorhwo1.bilivideo.com", "upos-sz-mirror08c.bilivideo.com", "upos-sz-mirroraliov.bilivideo.com", "upos-sz-mirrorcosov.bilivideo.com", "upos-sz-mirrorhwov.bilivideo.com", "cn-hk-eq-01-01.bilivideo.com", "cn-hk-eq-01-03.bilivideo.com", "cn-hk-eq-01-09.bilivideo.com", "cn-hk-eq-01-10.bilivideo.com", "cn-hk-eq-01-12.bilivideo.com", "cn-hk-eq-01-13.bilivideo.com", "cn-hk-eq-01-14.bilivideo.com"]
  host_mcdn:
    name: "[主机名] 重定向 MCDN 主机名 (中国大陆)"
    description: "请选择 MCDN 要重定向的主机名。"
    options: ["proxy-tf-all-ws.bilivideo.com"]
  splash:
