  feed_story_commercial:
    name: "[首页] 去除Story商业按钮"
    description: "移除Story中的“助TA必火”等商业推广按钮，不删除视频卡片。"
    options: ["true", "false"]
  search_ad:
    name: "[搜索] 去除广告"
    description: "是否启用此处修改"
    options: ["true", "false"]
  search_tracking:
    name: "[搜索] 移除响应跟踪参数"
    description: "清理SearchAll结果对象及跳转链接中的trackid、report_flow_data，不修改播放签名和预加载数据。"
    options: ["true", "false"]
  search_hot_search:
    name: "[搜索] 去除“热搜”"
    description: "是否启用此处修改"
    options: ["true", "false"]
  pgc_ad:
    name: "[番剧电影] 去除广告"
    description: "是否启用此处修改"
    options: ["true", "false"]
  xlive_ad:
    name: "[直播] 去除广告"
    description: "是否启用此处修改"
    options: ["true", "false"]
  xlive_remove_tracking_callbacks:
    name: "[直播] 移除推荐回调"
    description: "移除直播推荐卡的show_callback与click_callback；可能影响推荐状态和翻页。"
    options: ["true", "false"]
  xlive_remove_preload_tracking:
    name: "[直播] 移除预载链接trackid"
    description: "只移除直播small_card_v1.subtitle_style.link中的trackid，保留播放、清晰度和会话参数。"
    options: ["true", "false"]
  dynamic_hot_topics:
    name: "[动态] 去除“热门话题”"
    description: "是否启用此处修改"
    options: ["true", "false"]
  dynamic_most_visited:
    name: "[动态] 去除“最常访问”"
    description: "是否启用此处修改"
