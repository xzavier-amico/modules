name: '📺 BiliBili: Biliverse (Enhanced+Global+Redirect+ADBlock)'
description: 哔哩哔哩：增强 + 全球 + 重定向 + 去广告 合并模块。
author: VirgilClyne et al.
homepage: https://biliverse.github.io/guide/
icon: https://github.com/Biliverse/Enhanced/raw/main/src/assets/icon_rounded.png
open_url: http://boxjs.com/#/app/Biliverse.Enhanced
compat_arguments:
  Home.Switch: 'true'
  Home.Tab: 2036,2037,780,545,151
  Home.Tab_default: '2037'
  Home.Top_left: mine
  Home.Top: messages
  Home.Top_more: categories,search
  Bottom: home,dynamic,ogv,mall,mine
  Region.Switch: 'true'
  Mine.Switch: 'true'
  Mine.iPad.Switch: 'true'
  Storage: PersistentStore
  LogLevel: WARN
  ForceHost: '1'
  Locales: CHN,HKG,TWN
  Proxies.CHN: DIRECT
  Proxies.HKG: 🇭🇰香港
  Proxies.MAC: 🇲🇴澳门
  Proxies.TWN: 🇹🇼台湾
  Host.OverseaVideo: upos-sz-mirrorali.bilivideo.com
  Host.BStar: upos-sz-mirrorali.bilivideo.com
  Host.PCDN: upos-sz-mirrorali.bilivideo.com
  Host.MCDN: proxy-tf-all-ws.bilivideo.com
  Splash: 'true'
  Feed.AD: 'true'
  Feed.Activity: 'false'
  Feed.Vertical: 'false'
  Feed.BlockUpLiveList: ''
  Feed.Story: 'true'
  Feed.StoryCommercial: 'true'
  Search.AD: 'true'
  Search.Tracking: 'false'
  Search.HotSearch: 'true'
  PGC.AD: 'true'
  Xlive.AD: 'true'
  Xlive.RemoveTrackingCallbacks: 'false'
  Xlive.RemovePreloadTracking: 'false'
  Dynamic.HotTopics: 'true'
  Dynamic.MostVisited: 'false'
  Dynamic.MostVisitedLiveOnly: 'false'
  Dynamic.AdCard: 'true'
  Dynamic.PersonalAdCard: 'false'
  View.AD: 'true'
  DM.Command: 'false'
  DM.Colorful: 'false'
  DM.Airborne: 'false'
  Reply.AD: 'true'
  Reply.CommercialLinks: 'false'
  Reply.SubjectDescriptionCommercial: 'false'
  Privacy.Tracking: 'true'
  Privacy.BlockBiliCommercial: 'false'
  Privacy.BlockThirdParty: 'false'
  Privacy.Strict: 'false'
compat_arguments_desc: "## Enhanced\nHome.Switch: [首页] 启用自定义功能\n启用后可自定义首页顶栏、标签页和底部导航栏内容。标签页由分区页的快捷访问决定。\n\nHome.Tab: [首页] 标签页\n    ├ 2036: 直播\n    ├ 2037: 推荐\n    ├ 780: 热门\n    ├ 545: 番剧\n    ├ 774: 动画（港澳台）\n    ├ 151: 影视\n    ├ 801: 韩综（港澳台）\n    └ 2280: 校园\n这里只列出常用选项；分区页提供接近60个快捷访问选项，无法在模块参数中完整列出。请前往 BiliBili App 分区页，使用原生“快捷访问”功能自定义首页标签页。\n\nHome.Tab_default: [首页] 默认标签页\n    ├ 2036: 直播\n    ├ 2037: 推荐\n    ├ 780: 热门\n    ├ 545: 番剧\n    ├ 774: 动画（港澳台）\n    ├ 151: 影视\n    ├ 801: 韩综（港澳台）\n    └ 2280: 校园\n请选择启动APP时默认展示的标签页，需先将该标签页加入分区页的快捷访问。\n\nHome.Top_left: [首页] 顶栏（左侧）按钮（用户头像）\n    ├ mine: 用户中心-我的\n    └ videoshortcut: 短视频\n请选择顶栏（左侧）按钮（用户头像）的作用（在biliBili粉色版中无法修改）。\n\nHome.Top: [首页] 顶栏（右侧）按钮\n    ├ game_center: 游戏中心\n    ├ mall: 会员购\n    └ messages: 消息\n请选择启用的顶栏（右侧）按钮。\n\nHome.Top_more: [首页] 标签栏右侧按钮\n    ├ categories: 更多分区\n    └ search: 搜索\n请选择启用的首页标签栏右侧按钮。\n\nBottom: [底部] 导航栏按钮\n    ├ home: 首页\n    ├ dynamic: 动态\n    ├ publish: 发布\n    ├ ogv: 节目（港澳台）\n    ├ mall: 会员购\n    ├ messages: 消息\n    └ mine: 我的\n请选择启用的底部导航栏按钮，最多6个。\n\nRegion.Switch: [分区] 启用此标签页自定义功能\n启用后可自定义分区标签页的内容。\n\nMine.Switch: [我的] 启用此标签页自定义功能\n启用后可自定义我的标签页的服务内容。\n\nMine.iPad.Switch: [我的 iPad版] 启用此标签页自定义功能\n启用后可自定义iPad版我的标签页的服务内容。\n\nStorage: [储存] 配置类型\n    ├ Argument: 优先使用 $argument，其次使用 PersistentStore (BoxJs)，最后使用 database.mjs 的默认配置\n    ├ PersistentStore: 优先使用 PersistentStore (BoxJs)，其次使用 $argument，最后使用 database.mjs 的默认配置\n    └ database: 只使用由作者的 database.mjs 文件提供的默认配置，其他任何自定义配置不再起作用\n默认使用 PersistentStore，配置优先级为 database -> $argument -> PersistentStore (BoxJs)；选择 Argument 时为 database -> PersistentStore (BoxJs) -> $argument。\n\nLogLevel: [调试] 日志等级\n    ├ OFF: 关闭\n    ├ ERROR: ❌ 错误\n    ├ WARN: ⚠️ 警告\n    ├ INFO: ℹ️ 信息\n    ├ DEBUG: \U0001F171️ 调试\n    └ ALL: 全部\n选择脚本日志的输出等级，低于所选等级的日志将全部输出。\n\n## Global\nForceHost: 强制CDN主机名类型\n    ├ 0: IP: 返回远端DNS解析地址（强烈不推荐！严重影响域名分流规则与CDN重定向）\n    ├ 1: HTTP: 返回HTTP域名（推荐，免去重定向时MitM操作）\n    └ 2: HTTPS: 返回HTTPS域名（不推荐，重定向时需对指定域名启用MitM）\n请设置强制返回的CDN主机名类型。\n\nLocales: 启用自动识别与分流功能的地区\n    ├ CHN: \U0001F1E8\U0001F1F3中国大陆\n    ├ HKG: \U0001F1ED\U0001F1F0中国香港\n    ├ MAC: \U0001F1F2\U0001F1F4中国澳门\n    └ TWN: \U0001F1F9\U0001F1FC中国台湾\n请选择启用自动识别与分流功能的地区。\n\nProxies.CHN: [\U0001F1E8\U0001F1F3中国大陆] 代理策略名称\n请填写此地区的代理或策略组名称。\n\nProxies.HKG: [\U0001F1ED\U0001F1F0中国香港] 代理策略名称\n请填写此地区的代理或策略组名称。\n\nProxies.MAC: [\U0001F1F2\U0001F1F4中国澳门] 代理策略名称\n请填写此地区的代理或策略组名称。\n\nProxies.TWN: [\U0001F1F9\U0001F1FC中国台湾] 代理策略名称\n请填写此地区的代理或策略组名称。\n\nStorage: [储存] 配置类型\n    ├ Argument: 优先使用来自 $argument 的配置，$argument 不包含的设置项由 PersistentStore (BoxJs) 提供\n    ├ PersistentStore: 只使用 PersistentStore (BoxJs) 提供的配置\n    └ database: 只使用由作者的 database.mjs 文件提供的默认配置，其他任何自定义配置不再起作用\n选择要使用的配置类型。未设置此选项或不通过此选项的旧版本的配置顺序依旧是 PersistentStore (BoxJs) > $argument > database。\n\nLogLevel: [调试] 日志等级\n    ├ OFF: 关闭\n    ├ ERROR: ❌ 错误\n    ├ WARN: ⚠️ 警告\n    ├ INFO: ℹ️ 信息\n    ├ DEBUG: \U0001F171️ 调试\n    └ ALL: 全部\n选择脚本日志的输出等级，低于所选等级的日志将全部输出。\n\n## Redirect\nHost.OverseaVideo: [主机名] 重定向 OverseaVideo CDN (港澳台)\n    ├ upos-sz-mirrorali.bilivideo.com: 阿里云 CDN\n    ├ upos-sz-mirrorcos.bilivideo.com: 腾讯云 CDN\n    ├ upos-sz-mirrorhw.bilivideo.com: 华为云 CDN，融合 CDN\n    ├ upos-sz-mirrorhwo1.bilivideo.com: 华为云 CDN，融合 CDN（mirrorhwo1）\n    ├ upos-sz-mirror08c.bilivideo.com: 华为云 CDN，融合 CDN（mirror08c）\n    ├ upos-sz-mirroraliov.bilivideo.com: 阿里云 CDN，海外\n    ├ upos-sz-mirrorcosov.bilivideo.com: 腾讯云 CDN，海外\n    ├ upos-sz-mirrorhwov.bilivideo.com: 华为云 CDN，海外\n    ├ cn-hk-eq-01-01.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-03.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-09.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-10.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-12.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-13.bilivideo.com: Equinix IX CDN，香港\n    └ cn-hk-eq-01-14.bilivideo.com: Equinix IX CDN，香港\n请选择 OverseaVideo 要重定向的主机名。\n\nHost.BStar: [主机名] 重定向 BStar CDN (国际版)\n    ├ upos-sz-mirrorali.bilivideo.com: 阿里云 CDN\n    ├ upos-sz-mirrorcos.bilivideo.com: 腾讯云 CDN\n    ├ upos-sz-mirrorhw.bilivideo.com: 华为云 CDN，融合 CDN\n    ├ upos-sz-mirrorhwo1.bilivideo.com: 华为云 CDN，融合 CDN（mirrorhwo1）\n    ├ upos-sz-mirror08c.bilivideo.com: 华为云 CDN，融合 CDN（mirror08c）\n    ├ upos-sz-mirroraliov.bilivideo.com: 阿里云 CDN，海外\n    ├ upos-sz-mirrorcosov.bilivideo.com: 腾讯云 CDN，海外\n    ├ upos-sz-mirrorhwov.bilivideo.com: 华为云 CDN，海外\n    ├ cn-hk-eq-01-01.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-03.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-09.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-10.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-12.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-13.bilivideo.com: Equinix IX CDN，香港\n    └ cn-hk-eq-01-14.bilivideo.com: Equinix IX CDN，香港\n请选择 BStar 要重定向的主机名。\n\nHost.PCDN: [主机名] 重定向 PCDN 主机名 (中国大陆)\n    ├ upos-sz-mirrorali.bilivideo.com: 阿里云 CDN\n    ├ upos-sz-mirrorcos.bilivideo.com: 腾讯云 CDN\n    ├ upos-sz-mirrorhw.bilivideo.com: 华为云 CDN，融合 CDN\n    ├ upos-sz-mirrorhwo1.bilivideo.com: 华为云 CDN，融合 CDN（mirrorhwo1）\n    ├ upos-sz-mirror08c.bilivideo.com: 华为云 CDN，融合 CDN（mirror08c）\n    ├ upos-sz-mirroraliov.bilivideo.com: 阿里云 CDN，海外\n    ├ upos-sz-mirrorcosov.bilivideo.com: 腾讯云 CDN，海外\n    ├ upos-sz-mirrorhwov.bilivideo.com: 华为云 CDN，海外\n    ├ cn-hk-eq-01-01.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-03.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-09.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-10.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-12.bilivideo.com: Equinix IX CDN，香港\n    ├ cn-hk-eq-01-13.bilivideo.com: Equinix IX CDN，香港\n    └ cn-hk-eq-01-14.bilivideo.com: Equinix IX CDN，香港\n请选择 PCDN 要重定向的主机名。\n\nHost.MCDN: [主机名] 重定向 MCDN 主机名 (中国大陆)\n    └ proxy-tf-all-ws.bilivideo.com: proxy-tf-all-ws.bilivideo.com\n请选择 MCDN 要重定向的主机名。\n\nStorage: [储存] 配置类型\n    ├ Argument: 优先使用来自 $argument 的配置，$argument 不包含的设置项由 PersistentStore (BoxJs) 提供\n    ├ PersistentStore: 只使用 PersistentStore (BoxJs) 提供的配置\n    └ database: 只使用由作者的 database.mjs 文件提供的默认配置，其他任何自定义配置不再起作用\n选择要使用的配置类型。未设置此选项或不通过此选项的旧版本的配置顺序依旧是 PersistentStore (BoxJs) > $argument > database.\n\nLogLevel: [调试] 日志等级\n    ├ OFF: 关闭\n    ├ ERROR: ❌ 错误\n    ├ WARN: ⚠️ 警告\n    ├ INFO: ℹ️ 信息\n    ├ DEBUG: \U0001F171️ 调试\n    └ ALL: 全部\n选择脚本日志的输出等级，低于所选等级的日志将全部输出。\n\n## ADBlock\nSplash: [开屏] 去除广告\n是否启用此处修改\n\nFeed.AD: [推荐] 去除广告\n是否启用此处修改\n\nFeed.Activity: [推荐] 去除“活动大图”\n是否启用此处修改\n\nFeed.Vertical: [推荐] 去除竖屏视频\n是否启用此处修改\n\nFeed.BlockUpLiveList: [推荐] 屏蔽UP主直播推广\n填写up主uid，以英文逗号隔开。\n\nFeed.Story: [首页] 去除短视频流广告\n是否启用此处修改\n\nFeed.StoryCommercial: [首页] 去除Story商业按钮\n移除Story中的“助TA必火”等商业推广按钮，不删除视频卡片。\n\nSearch.AD: [搜索] 去除广告\n是否启用此处修改\n\nSearch.Tracking: [搜索] 移除响应跟踪参数\n清理SearchAll结果对象及跳转链接中的trackid、report_flow_data，不修改播放签名和预加载数据。\n\nSearch.HotSearch: [搜索] 去除“热搜”\n是否启用此处修改\n\nPGC.AD: [番剧电影] 去除广告\n是否启用此处修改\n\nXlive.AD: [直播] 去除广告\n是否启用此处修改\n\nXlive.RemoveTrackingCallbacks: [直播] 移除推荐回调\n移除直播推荐卡的show_callback与click_callback；可能影响推荐状态和翻页。\n\nXlive.RemovePreloadTracking: [直播] 移除预载链接trackid\n只移除直播small_card_v1.subtitle_style.link中的trackid，保留播放、清晰度和会话参数。\n\nDynamic.HotTopics: [动态] 去除“热门话题”\n是否启用此处修改\n\nDynamic.MostVisited: [动态] 去除“最常访问”\n是否启用此处修改\n\nDynamic.MostVisitedLiveOnly: [动态] “最常访问”仅显示直播\n是否启用此处修改\n\nDynamic.AdCard: [动态] 去除广告卡片\n是否启用此处修改\n\nDynamic.PersonalAdCard: [动态] 去除个人流广告卡片\n过滤DynAllPersonal与DynVideoPersonal中的cardType=15；当前抓包尚无广告阳性样本。\n\nView.AD: [视频] 去除播放页广告\n是否启用此处修改\n\nDM.Command: [弹幕] 去除交互式弹幕\n是否启用此处修改\n\nDM.Colorful: [弹幕] 替换彩色弹幕\n是否启用此处修改\n\nDM.Airborne: [弹幕] 空降助手\n是否启用此处修改\n\nReply.AD: [评论] 去除广告\n是否启用此处修改\n\nReply.CommercialLinks: [评论] 禁用普通评论商业跳转\n保留普通评论正文与回复树，仅移除已识别商品链接的可点击映射。\n\nReply.SubjectDescriptionCommercial: [评论] 隐藏编辑器商品能力\n移除SubjectDescription中的商品与商业助手按钮(type 5/8)；当前抓包中它们均为隐藏状态。\n\nPrivacy.Tracking: [隐私] 移除响应链接跟踪参数\n清理推荐、Story 与评论跳转链接中的高置信度归因参数，保留目标和界面功能参数。\n\nPrivacy.BlockBiliCommercial: [隐私] 阻止B站商业上报\n本地成功响应conversion/mobile/v2与fees/wise，阻止相关请求上传。\n\nPrivacy.BlockThirdParty: [隐私] 阻止第三方广告归因\n本地响应已确认的千问与Solar Engine广告展示、点击和归因请求。\n\nPrivacy.Strict: [隐私] 严格模式\n同时启用响应跟踪清理、商业链接与上报阻断，并移除直播show/click callback；可能影响跳转、推荐和翻页。\n\nStorage: [储存] 配置类型\n    ├ Argument: 优先使用 $argument，其次使用 PersistentStore (BoxJS)，最后使用默认配置\n    ├ PersistentStore: 优先使用 PersistentStore (BoxJS)，其次使用 $argument，最后使用默认配置\n    └ database: 只使用默认配置\n仅由模板参数选择配置来源；默认优先使用 PersistentStore (BoxJS)。\n\nLogLevel: [调试] 日志等级\n    ├ OFF: \U0001F534 关闭\n    ├ ERROR: ❌ 错误\n    ├ WARN: ⚠️ 警告\n    ├ INFO: ℹ️ 信息\n    ├ DEBUG: \U0001F171️ 调试\n    └ ALL: 全部\n选择脚本日志的输出等级，低于所选等级的日志将全部输出。"
compat_arguments_schema:
  Home.Switch:
    name: '[首页] 启用自定义功能'
    description: 启用后可自定义首页顶栏、标签页和底部导航栏内容。标签页由分区页的快捷访问决定。
    options:
    - 'true'
    - 'false'
  Home.Tab:
    name: '[首页] 标签页'
    description: 这里只列出常用选项；分区页提供接近60个快捷访问选项，无法在模块参数中完整列出。请前往 BiliBili App 分区页，使用原生“快捷访问”功能自定义首页标签页。
    options: []
  Home.Tab_default:
    name: '[首页] 默认标签页'
    description: 请选择启动APP时默认展示的标签页，需先将该标签页加入分区页的快捷访问。
    options:
    - '2037'
    - '2036'
    - '780'
    - '545'
    - '774'
    - '151'
    - '801'
    - '2280'
  Home.Top_left:
    name: '[首页] 顶栏（左侧）按钮（用户头像）'
    description: 请选择顶栏（左侧）按钮（用户头像）的作用（在biliBili粉色版中无法修改）。
    options:
    - mine
    - videoshortcut
  Home.Top:
    name: '[首页] 顶栏（右侧）按钮'
    description: 请选择启用的顶栏（右侧）按钮。
    options: []
  Home.Top_more:
    name: '[首页] 标签栏右侧按钮'
    description: 请选择启用的首页标签栏右侧按钮。
    options: []
  Bottom:
    name: '[底部] 导航栏按钮'
    description: 请选择启用的底部导航栏按钮，最多6个。
    options: []
  Region.Switch:
    name: '[分区] 启用此标签页自定义功能'
    description: 启用后可自定义分区标签页的内容。
    options:
    - 'true'
    - 'false'
  Mine.Switch:
    name: '[我的] 启用此标签页自定义功能'
    description: 启用后可自定义我的标签页的服务内容。
