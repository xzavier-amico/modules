#=======================================================================================
# Spotify Premium — Egern 模块
#
# 去广告、解锁 Premium 播放限制，并用第三方歌词补全 Now Playing 与歌词卡。
#
# 改写 /bootstrap 与 /user-customization-service 下发的账号状态和远程配置。
# 只修改目标字段，未知字段与字段顺序保持原样。
#
# 歌词：将曲目元数据里的 has_lyrics 改为 true，客户端才会请求 color-lyrics；
# 官方 404 时由 spotify_lyrics.js 用第三方歌词补全。
# 滚动页缺少歌词 section 时补一格；官方已有则不重复补。
#
# 字段号按客户端版本维护；只改写目标字段，未知字段与字段顺序保持原样。
#
# 需要开启 MITM 并信任证书。首次生效需切换网络或重启 App，让客户端重新拉取 bootstrap。
# 不要与旧的「Spotify AD」模块同时启用，两者会改写同一响应。
#=======================================================================================

name: "Spotify Premium"
description: "去广告、解锁 Premium 播放限制，并用第三方歌词补全 Now Playing 与歌词卡。只改写目标 protobuf 字段，未知字段原样保留。"
author: "xzavier-amico"
homepage: "https://github.com/xzavier-amico/modules"
icon: "https://raw.githubusercontent.com/xzavier-amico/modules/master/icon/spotify.png"

# ---- 参数（Egern 原生 env_schema：设置页自动生成开关 / 选择器 / 输入框）----
# options 为 ["true","false"] 时渲染开关，其它 options 渲染选择器，不写 options 渲染输入框。
env_schema:
  spoof_premium:
    name: "伪装 Premium"
    description: "把账号状态改写为 premium。关闭后不再伪装 Premium，歌词补全不受影响"
    default_value: "true"
    options: ["true", "false"]
  block_ads:
    name: "去除广告"
    description: "关闭广告相关开关，并移除广告与推广位的远程配置"
    default_value: "true"
    options: ["true", "false"]
  unlock_playback:
    name: "解锁播放限制"
    description: "移除试听时长上限、队列上限与强制随机等免费版限制"
    default_value: "true"
    options: ["true", "false"]
  enable_lyrics:
    name: "补全歌词"
    description: "官方没有歌词时用第三方歌词补上"
    default_value: "true"
    options: ["true", "false"]
  lyrics_source:
    name: "歌词来源"
    description: "官方没有歌词时去哪个库找。默认 auto 并发查询网易云、QQ、LRCLIB，首个匹配的同步歌词胜出；Musixmatch 仅在显式选择时使用"
    default_value: "auto"
    options: ["auto", "lrclib", "musixmatch", "netease", "qq"]
  desktop:
    name: "设备类型"
    description: "auto 按 User-Agent 识别 iPhone / iPad 与 Mac；识别不准时手动指定。桌面端默认不写播放授权"
    default_value: "auto"
    options: ["auto", "ios", "macos"]

rules:
  # 广告域名兜底：脚本关闭服务端广告开关，这里拦截广告素材与曝光回传。
  # 音频广告由服务端插入音频流，域名层无法拦截。
  - domain_suffix:
      match: "ads.spotify.com"
      policy: REJECT
  - domain_suffix:
      match: "adeventtracker.spotify.com"
      policy: REJECT
  - domain_suffix:
      match: "aet.spotify.com"
      policy: REJECT
  # 强制 Spotify 的 QUIC 回落到 TCP，确保请求经过 HTTP 代理。
  # 个别版本拒绝 QUIC 后可能跳歌，遇到时再调整这条规则。
  - and:
      match:
        - domain_suffix:
            match: "spotify.com"
        - protocol:
            match: quic
      policy: REJECT

# 桌面端广告接口；iOS 不请求这些路径，保留不影响。
# Loon 插件里对应的是 request reject(404)，Egern 用 url_rewrites 的 reject 特殊值。
url_rewrites:
  - match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/ads\\/v[12]\\/"
    location: "http://reject/"

# 删除 if-none-match，避免 304 空响应导致脚本拿不到 body。
header_rewrites:
  - delete:
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/(?:bootstrap|user-customization-service)\\/"
      name: "if-none-match"
      type: "request"
  - delete:
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/extended-metadata\\/"
      name: "if-none-match"
      type: "request"
  - delete:
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/color-lyrics\\/"
      name: "if-none-match"
      type: "request"
  # 远程配置 / 账号属性 / feed 同样删除 if-none-match。
  - delete:
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/(?:remote-config-resolver|nebula|casita|browsita|scrollsita)\\/"
      name: "if-none-match"
      type: "request"

scriptings:
  # 删除 extended-metadata 请求体里的 etag，避免服务端回空数组。
  - http_request:
      name: "spotify.meta.req"
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/extended-metadata\\/"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify/js/spotify.js?v=20261114-5"
      body_required: true
      binary_body: true
      max_size: 12582912
      timeout: 10

  # 改写账号状态与远程配置。
  - http_response:
      name: "spotify.premium"
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/(?:bootstrap|user-customization-service)"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify/js/spotify.js?v=20261114-5"
      body_required: true
      binary_body: true
      max_size: 41943040
      timeout: 30

  # 将曲目元数据里的 has_lyrics 改为 true，客户端才会请求 color-lyrics。
  - http_response:
      name: "spotify.meta"
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/(?:extended-metadata|context-resolve|connect-state|metadata\\/4\\/track)\\/"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify/js/spotify.js?v=20261114-5"
      body_required: true
      binary_body: true
      max_size: 12582912
      timeout: 10

  # 改写 bootstrap 之后重新拉取的远程配置与账号属性。
  - http_response:
      name: "spotify.config"
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/(?:remote-config-resolver|nebula)\\/"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify/js/spotify.js?v=20261114-5"
      body_required: true
      binary_body: true
      max_size: 12582912
      timeout: 10

  # 过滤首页 / 搜索 / 滚动页赞助内容，并补歌词 section。
  # scrollsita 的响应可以到 12MB，解析 + 重编码在手机上偶尔超过 10 秒，
  # 超时后 Egern 会放行原始响应，歌词卡片就不出现（重进一次才补上），所以放宽到 30。
  - http_response:
      name: "spotify.feed"
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/(?:casita\\/v\\d+\\/home|browsita\\/v\\d+\\/browse|scrollsita\\/v\\d+\\/scroll)"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify/js/spotify.feed.js?v=20261114-4"
      body_required: true
      binary_body: true
      max_size: 12582912
      timeout: 30

  # 官方有歌词时原样放行，没有时用第三方歌词补全。
  # body_required 必须开：Egern 不开这个开关时既不把 body 交给脚本，也不接受
  # 脚本返回的 body，补出来的歌词会被丢掉（表现为「查到了歌词但不显示」）。
  # 没有 body 的 404 / 200 空响应照样会进脚本，由脚本自己判断。
  # Egern 不支持按参数加载脚本，关闭补全歌词时脚本会立即返回。
  - http_response:
      name: "spotify.lyrics"
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/color-lyrics\\/v\\d\\/track\\/"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify/js/spotify_lyrics.js?v=20261114-4"
      body_required: true
      binary_body: true
      max_size: 2097152
      timeout: 30

mitm:
  hostnames:
    includes:
      - "*-spclient.spotify.com"
      - "spclient.wg.spotify.com"
