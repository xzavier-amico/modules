#=======================================================================================
# Spotify Premium — Egern 模块
#
# 去广告 + 解锁 Premium 状态与顺序/随机播放。
#
# 做法：Spotify 用 protobuf 在 /bootstrap 与 /user-customization-service 下发账号
# 状态（catalogue / player-license / streaming-rules …）与远程配置开关。脚本按
# 字段号走进消息，只改决定「免费还是 Premium」的那些字段，其余字节原样写回，
# 未知字段、字段顺序、非规范 varint 都不动 —— 这是避免播放几秒被跳过的关键。
#
# 字段号来源：
#   whoeevee/EeveeSpotifyReborn  Sources/EeveeSpotify/Premium（SwiftProtobuf 生成代码）
#   skopevoj/spoti.pw (v0.21.1)  tweak/Sources/Shared/AdBlock/{Protobuf,Premium}.m
#
# 注意：
#   - 需开启 MITM 并信任证书。
#   - 不要与旧的「Spotify AD」模块同时启用，两者都会改写同一响应。
#   - 首次生效需要让 App 重新拉取 bootstrap：切换一次网络或重启 App。
#=======================================================================================

name: "Spotify Premium"
description: "去广告 + 解锁 Premium 状态与顺序/随机播放。改写 bootstrap 与 user-customization-service 的 protobuf，未知字段原样保留。"
author: "xzavier-amico"
homepage: "https://github.com/xzavier-amico/modules"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Spotify.png"

compat_arguments:
  spoof_premium: "true"
  block_ads: "true"
  unlock_playback: "true"
  lyrics_source: "lrclib"

compat_arguments_desc: |
  spoof_premium   — 伪装 Premium（总开关）
  block_ads       — 去除广告
  unlock_playback — 解锁播放限制
  lyrics_source   — 歌词来源：lrclib / auto / musixmatch / netease / qq

compat_arguments_schema:
  spoof_premium:
    name: "伪装 Premium"
    description: "把账号状态改写为 premium。关闭后本插件不做任何修改"
    options: ["true", "false"]
  block_ads:
    name: "去除广告"
    description: "关闭广告相关开关，并移除广告与推广位的远程配置"
    options: ["true", "false"]
  unlock_playback:
    name: "解锁播放限制"
    description: "移除试听时长上限、队列上限与强制随机等免费版限制"
    options: ["true", "false"]
  lyrics_source:
    name: "歌词来源"
    description: "官方没有歌词时去哪个库找。lrclib 曲库全但中文偏弱；auto 依次尝试 lrclib、musixmatch、网易云、QQ 音乐"
    options: ["lrclib", "auto", "musixmatch", "netease", "qq"]

rules:
  # 广告域名兜底：脚本改的是服务端下发的广告开关，这里再拦一层真正投放广告的域名。
  # 免费号的音频广告是服务端缝进流里的，拦域名没用；能挡的是展示位、播客外链广告和
  # 广告曝光回传。doubleclick / googlesyndication 是全局域名，其它 App 也会一起被拦。
  - domain_suffix:
      match: "ads.spotify.com"
      policy: REJECT
  - domain_suffix:
      match: "adeventtracker.spotify.com"
      policy: REJECT
  - domain_suffix:
      match: "pubads.g.doubleclick.net"
      policy: REJECT
  - domain_suffix:
      match: "securepubads.g.doubleclick.net"
      policy: REJECT
  - domain_suffix:
      match: "googleads.g.doubleclick.net"
      policy: REJECT
  - domain_suffix:
      match: "pagead2.googlesyndication.com"
      policy: REJECT
  - domain_suffix:
      match: "tpc.googlesyndication.com"
      policy: REJECT
  - domain_suffix:
      match: "adservice.google.com"
      policy: REJECT
  - domain_suffix:
      match: "www.googletagservices.com"
      policy: REJECT

# UCS / extended-metadata / color-lyrics 都带 etag。客户端带 if-none-match 上来、
# 服务端回 304 时响应体是空的，脚本拿不到 body 就只能放行，客户端继续用缓存里的
# 旧值（is_lyrics_card_element_enabled=false、has_lyrics=false、404 无歌词），
# 于是改了开关也「没生效」。把校验头删掉，强制每次都拿完整响应。
header_rewrites:
  - delete:
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/user-customization-service\\/"
      name: "if-none-match"
      type: "request"
  - delete:
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/extended-metadata\\/"
      name: "if-none-match"
      type: "request"
  - delete:
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/color-lyrics\\/"
      name: "if-none-match"
      type: "request"

scriptings:
  # extended-metadata 的 etag 在请求体里（ExtensionQuery.etag），请求阶段先把它抹掉，
  # 否则服务端只回「没变」，客户端继续用本地那份 has_lyrics=false 的实体。
  - http_request:
      name: "spotify.meta.req"
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/extended-metadata\\/"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify/js/spotify_meta.js?v=20261107-5"
      body_required: true
      binary_body: true
      max_size: 8388608
      timeout: 10

  - http_response:
      name: "spotify.premium"
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/(?:bootstrap|user-customization-service)"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify/js/spotify_premium.js?v=20261107-5"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 30
      env:
        _compat.$argument: '{"spoof_premium":{{{spoof_premium}}},"block_ads":{{{block_ads}}},"unlock_playback":{{{unlock_playback}}}}'

  # 把曲目元数据里的 has_lyrics 改成 true，客户端才肯去请求 color-lyrics。
  # extended-metadata 是主路径（TRACK_V4 里的 Track 字段 18），context-resolve 兜底。
  - http_response:
      name: "spotify.meta"
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/(?:extended-metadata|context-resolve|connect-state|metadata\\/4\\/track)\\/"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify/js/spotify_meta.js?v=20261107-5"
      body_required: true
      binary_body: true
      max_size: 8388608
      timeout: 10

  # 官方没有歌词时用第三方歌词补上；官方有歌词就原样放行。
  # 不强制 body_required：没有歌词时官方回 404 且 body 为空，强制读 body 脚本就不会执行。
  - http_response:
      name: "spotify.lyrics"
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/color-lyrics\\/v\\d\\/track\\/"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify/js/spotify_lyrics.js?v=20261107-5"
      binary_body: true
      max_size: 1048576
      timeout: 10
      env:
        _compat.$argument: '{"lyrics_source":"{{{lyrics_source}}}"}'

mitm:
  hostnames:
    includes:
      - "*-spclient.spotify.com"
      - "spclient.wg.spotify.com"
