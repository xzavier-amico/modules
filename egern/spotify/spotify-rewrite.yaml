#=======================================================================================
# Spotify AD (Rewrite) — Egern 模块 (001ProMax/Surge 纯 rewrite 版)
# 无脚本，通过 mock 服务器返回修改后的响应
#=======================================================================================

name: "Spotify AD (Rewrite)"
description: "Spotify 去广告（纯 rewrite 版，无脚本，通过 mock 服务器）。"
author: "app2smile, 001"
homepage: "https://github.com/001ProMax/Surge"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Spotify.png"

compat_arguments:
  Mock: "https://mock.trigram-masques-8r.workers.dev/music"

compat_arguments_desc: |
  Mock — mock 服务器地址（默认使用 001ProMax 提供的）

compat_arguments_schema:
  Mock:
    name: "Mock 服务器地址"
    description: "用于返回修改后响应的 mock 服务器"
    options: []

# URL Rewrite: 移除追踪 (reject) + 重定向 bootstrap/user-customization-service 到 mock 服务器 (header mode)
url_rewrites:
  - match: "^https:\\/\\/(?:spclient\\.wg|[a-z0-9]+-spclient)\\.spotify\\.com(?::443)?\\/(?:ad-|gabo|pendragon|social)"
    location: "http://reject/"
  - match: "^https:\\/\\/(?:spclient\\.wg|[a-z0-9]+-spclient)\\.spotify\\.com(?::443)?\\/(?:user-customization-service|bootstrap)"
    location: "{{{Mock}}}/$1"

mitm:
  hostnames:
    includes:
      - "spclient.wg.spotify.com"
      - "g*-spclient.spotify.com"
