#=======================================================================================
# Xiaohongshu Probe — Egern 模块（排障专用）
#
# 只把接口路径与响应结构写进脚本日志，不改写任何内容。
# 抓完日志就关掉或删除，没有过滤效果。
#
# 日志一行一条，前缀 [XHS]：
#   Q POST /api/sns/v10/homefeed          请求阶段，只记路径
#   R /api/sns/v10/homefeed 200 48213B    响应阶段，状态码与长度
#   R keys=success,code,data              顶层字段
#   R count model_type → note:18 live:2   同字段取值分布
#   R ★ bottom_tab = [...]                底栏 / tab / 直播 / 广告相关字段原样带出
#=======================================================================================

name: "Xiaohongshu Probe"
description: "排障专用：只把接口路径与响应结构写进脚本日志，不改写任何内容。抓完日志就关掉或删除。"
author: "xzavier-amico"
homepage: "https://github.com/xzavier-amico/modules"
icon: "https://raw.githubusercontent.com/xzavier-amico/modules/master/icon/xiaohongshu.png"

rules:
  # 拒绝 QUIC，强制回落 TCP：HTTP/3 走 UDP，不经过 MITM，脚本看不到这些请求。
  - and:
      match:
        - domain_suffix:
            match: "xiaohongshu.com"
        - protocol:
            match: quic
      policy: REJECT

scriptings:
  # 请求阶段只记路径，不读 body。
  - http_request:
      name: "xiaohongshu.probe.url"
      match: "^https?:\\/\\/[a-z0-9.-]+\\.xiaohongshu\\.com\\/"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/xiaohongshu/js/xiaohongshu_probe.js?v=20261115-1"
      timeout: 10
  # 响应阶段读 body 记结构。
  - http_response:
      name: "xiaohongshu.probe.json"
      match: "^https?:\\/\\/[a-z0-9.-]+\\.xiaohongshu\\.com\\/(?:api|fe_api)\\/"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/xiaohongshu/js/xiaohongshu_probe.js?v=20261115-1"
      body_required: true
      max_size: 8388608
      timeout: 20

mitm:
  hostnames:
    includes:
      # 用通配覆盖全部子域：底栏与直播相关接口不一定在 edith / www / pages 上。
      - "*.xiaohongshu.com"
