#=======================================================================================
# Zhihu Clean — Egern 模块
#
# 知乎去开屏、首页推荐流广告与盐选推广、文章/回答底部推文全清（只留点赞/评论栏）及各类漂浮广告（阻断硬编码 IP / HTTPDNS 绕过）。
#=======================================================================================

name: "Zhihu Clean"
description: "知乎去开屏、首页推荐流广告与盐选推广、文章/回答底部推文全清及各类漂浮广告。"
author: "xzavier-amico"
homepage: "https://github.com/xzavier-amico/modules"
icon: "https://raw.githubusercontent.com/xzavier-amico/modules/master/icon/zhihu.png"

env_schema:
  block_ads:
    name: "去广告"
    description: "过滤知乎开屏、首页推荐流伪装广告、漂浮广告、热榜合作推广、回答夹层 ad_info 与评论区插件广告"
    default_value: "true"
    options: ["true", "false"]
  clean_ui:
    name: "极简文章底部与去盐选"
    description: "清空文章/回答底部的推荐推文与相关阅读（只留点赞/评论等操作栏），并过滤推荐流里的盐选故事、训练营、直播与带货卡"
    default_value: "true"
    options: ["true", "false"]

rules:
  - and:
      match:
        - domain_suffix:
            match: "zhihu.com"
        - protocol:
            match: quic
      policy: REJECT
  - ip_cidr:
      match: "118.89.204.198/32"
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      match: "103.41.167.237/32"
      policy: REJECT
      no_resolve: true
  - ip_cidr6:
      match: "2402:4e00:1200:ed00:0:9089:6dac:96b6/128"
      policy: REJECT
      no_resolve: true
  - domain:
      match: "appcloud.zhihu.com"
      policy: REJECT
  - domain:
      match: "appcloud2.in.zhihu.com"
      policy: REJECT
  - domain:
      match: "crash2.zhihu.com"
      policy: REJECT
  - domain:
      match: "mqtt.zhihu.com"
      policy: REJECT
  - domain:
      match: "sugar.zhihu.com"
      policy: REJECT
  - domain:
      match: "zxid-m.mobileservice.cn"
      policy: REJECT

url_rewrites:
  - match: "^https?:\\/\\/api\\.zhihu\\.com\\/commercial_api\\/(?:launch_v\\d+|real_time_launch_v\\d+|app_float_layer|ad_float_layer|float\\w*|banners_v\\d+\\/app_topstory_banner|banners|egg_payload|(?:answer|article)\\/\\d+\\/bottom-v\\d+)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/api\\.zhihu\\.com\\/(?:ad(?:-style-service\\/|s\\/|vert\\/|_)|fringe\\/|content-distribution-core\\/(?:bubble|float|pendant|popup|banner)\\/|root\\/window|moments\\/lastread|drama\\/(?:hot-drama-list|living-info)|bazaar\\/float_window|market\\/(?:popovers_v\\d+|float\\w*)|me\\/guides|distribute\\/rhea\\/)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/api\\.zhihu\\.com\\/ab\\/api\\/v\\d+\\/products\\/zhihu\\/platforms\\/ios\\/config"
    location: "http://reject/"
  - match: "^https?:\\/\\/api\\.zhihu\\.com\\/(?:api\\/v\\d+\\/)?(?:PresetWords|search\\/(?:preset_words|hot_search)|feed\\/render\\/revisit\\/current_reading)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/api\\.zhihu\\.com\\/(?:comment_v\\d+\\/(?:articles|answers)\\/\\d+\\/list-headers|prague\\/related_suggestion_native\\/feed|v\\d+(?:\\.\\d+)?\\/topics\\/(?:answer|article)\\/\\d+\\/relation|\\w+\\/\\d+\\/comments\\/featured-comment-ad|appview\\/api\\/v\\d+\\/(?:answers|articles)\\/\\d+\\/recommendations?)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/(?:api|www)\\.zhihu\\.com\\/(?:api\\/v\\d+\\/|v\\d+\\/)?(?:answers|articles|questions)\\/\\d+\\/(?:recommendations?|related-readings)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/api\\.zhihu\\.com\\/unlimited\\/go\\/my_card"
    location: "http://reject/"
  - match: "^https?:\\/\\/appcloud2\\.zhihu\\.com\\/v\\d+\\/resource\\?group_name=mp"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/www\\.zhihu\\.com\\/(?:api\\/v\\d+\\/(?:search\\/related_queries\\/(?:answer|article)\\/\\d+|hot_recommendation|mcn\\/v\\d+\\/linkcards)|commercial_api\\/banners_v\\d+\\/mobile_banner|appview\\/v\\d+\\/zhmore)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/zhuanlan\\.zhihu\\.com\\/api\\/articles\\/\\d+\\/recommendation"
    location: "http://reject/"
  - match: "^https?:\\/\\/zhstatic\\.zhihu\\.com\\/brand-ad"
    location: "http://reject/"

header_rewrites:
  - delete:
      match: "^https?:\\/\\/(?:appcloud2|m-cloud|api|page-info)\\.zhihu\\.com\\/(?:v\\d+\\/config|api\\/cloud\\/config\\/all|(?:answers|articles)\\/v\\d+\\/|next-(?:bff|data|render))"
      name: "if-none-match"
      type: "request"
  - delete:
      match: "^https?:\\/\\/(?:appcloud2|m-cloud|api|page-info)\\.zhihu\\.com\\/(?:v\\d+\\/config|api\\/cloud\\/config\\/all|(?:answers|articles)\\/v\\d+\\/|next-(?:bff|data|render))"
      name: "if-modified-since"
      type: "request"

scriptings:
  - http_response:
      name: "zhihu.clean"
      match: "^https?:\\/\\/(?:api|www|m|page-info|appcloud2|m-cloud)\\.zhihu\\.com\\/(?:v\\d+\\/config|api\\/cloud\\/config\\/all|commercial_api\\/(?:app|ad)_float_layer|(?:v\\d+\\/|feed\\/)?(?:preload-)?topstory\\/(?:recommend[\\w-]*|hot-lists|feed)|preload-topstory|moments(?:_v\\d+)?|feed\\/render\\/tab\\/config|root\\/tab|bazaar\\/vip_tab\\/header|(?:api\\/v\\d+\\/|v\\d+\\/)?(?:questions\\/\\d+(?:\\/(?:answers|feeds))?|answers|articles|comment(?:_v\\d+|s)|search)|next-(?:bff|data|render))(?:[/?]|$)"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/zhihu/js/zhihu_clean.js?v=20261124-2"
      body_required: true
      max_size: 8388608
      timeout: 20

mitm:
  hostnames:
    includes:
      - "api.zhihu.com"
      - "www.zhihu.com"
      - "m.zhihu.com"
      - "page-info.zhihu.com"
      - "appcloud2.zhihu.com"
      - "m-cloud.zhihu.com"
      - "zhuanlan.zhihu.com"
      - "zhstatic.zhihu.com"
