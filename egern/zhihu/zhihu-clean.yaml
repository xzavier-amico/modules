#=======================================================================================
# Zhihu Clean — Egern 模块
#
# 知乎去开屏、推荐流伪装广告、回答页夹层广告与评论区推广。
#=======================================================================================

name: "Zhihu Clean"
description: "知乎去开屏、推荐流伪装广告、回答页夹层广告与评论区推广。"
author: "xzavier-amico"
homepage: "https://github.com/xzavier-amico/modules"
icon: "https://raw.githubusercontent.com/xzavier-amico/modules/master/icon/zhihu.png"

env_schema:
  block_ads:
    name: "去广告"
    description: "过滤知乎开屏、首页推荐流 feed_advert、回答夹层 ad_info 与评论区插件广告"
    default_value: "true"
    options: ["true", "false"]
  clean_ui:
    name: "过滤盐选推广"
    description: "额外过滤推荐流里的盐选故事、知乎严选与训练营营销卡片，以及回答页带货卡"
    default_value: "false"
    options: ["true", "false"]

rules:
  - and:
      match:
        - domain_suffix:
            match: "zhihu.com"
        - protocol:
            match: quic
      policy: REJECT
  - domain:
      match: "appcloud2.in.zhihu.com"
      policy: REJECT
  - domain:
      match: "crash2.zhihu.com"
      policy: REJECT
  - domain:
      match: "mqtt.zhihu.com"
      policy: REJECT
  - domain:
      match: "sugar.zhihu.com"
      policy: REJECT

url_rewrites:
  - match: "^https?:\\/\\/api\\.zhihu\\.com\\/(?:commercial_api\\/(?:ad_float_layer|banners|egg_payload)|ad-style-service\\/|fringe\\/ad)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/api\\.zhihu\\.com\\/api\\/v4\\/(?:PresetWords|search\\/preset_words)\\b"
    location: "http://reject-dict/"

scriptings:
  - http_response:
      name: "zhihu.clean"
      match: "^https?:\\/\\/(?:api|www)\\.zhihu\\.com\\/(?:commercial_api\\/(?:launch_v2|real_time_launch_v2)|(?:v2\\/)?topstory\\/(?:recommend|hot-lists)|api\\/v4\\/(?:questions\\/[^/]+\\/answers|answers\\/|comment(?:_v5|s)\\/|search)|next-(?:bff|data|render))(?:[/?]|$)"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/zhihu/js/zhihu_clean.js?v=20261123-1"
      body_required: true
      max_size: 8388608
      timeout: 20

mitm:
  hostnames:
    includes:
      - "api.zhihu.com"
      - "www.zhihu.com"
