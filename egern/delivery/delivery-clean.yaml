  - http_response:
      name: "shopping.clean"
      match: "^https?:\\/\\/(?:api\\.m\\.jd\\.com\\/(?:client\\.action|api)|(?:guide-acs|trade-acs|acs)\\.m\\.taobao\\.com\\/gw\\/mtop\\.|(?:acs\\.m|gw)\\.cainiao\\.com\\/gw\\/mtop\\.|(?:app|wx|api|m)\\.fcbox\\.com\\/|api\\.(?:pinduoduo|yangkeduo)\\.com\\/(?:api\\/|search|v\\d+\\/)|(?:wmapi|apimobile|mapi|i)\\.meituan\\.com\\/|wx\\.waimai\\.meituan\\.com\\/weapp\\/|(?:waimai-guide|client-api|newton-api)\\.ele\\.me\\/)"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/delivery/js/delivery_clean.js?v=20261123-3"
      body_required: true
      max_size: 8388608
      timeout: 20

