url_rewrites:
  - match: "^https?:\\/\\/api\\.m\\.jd\\.com\\/(?:client\\.action|api)\\?.*functionId=(?:deliverLayer|popupConfig|adStart|getAdList|start|home_launchConfig)\\b"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/homepage-gw\\.jd\\.com\\/npromotion"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/api\\.smart\\.jd\\.com\\/c\\/service\\/getLoadingLinks\\b"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/(?:guide-acs|acs)\\.m\\.taobao\\.com\\/gw\\/mtop\\.(?:taobao\\.baichuan\\.smb\\.get|taobao\\.idle\\.home\\.welcome|alimama\\.etao\\.ad|taobao\\.ad|cainiao\\.adx|cainiao\\.guoguo\\.nbnetflow\\.ads)\\."
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/(?:acs\\.m|gw)\\.cainiao\\.com\\/gw\\/mtop\\.cainiao\\.(?:adx|ad|guoguo\\.nbnetflow\\.ads|nbmensa\\.research)\\."
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/(?:app|wx|api|m)\\.fcbox\\.com\\/.*\\/(?:ad|ads|advert|splash|openScreen|popup|marketing)(?:\\/|[?]|$)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/api\\.(?:pinduoduo|yangkeduo)\\.com\\/api\\/(?:oak\\/integration\\/render|carnival\\/image_list|cappuccino\\/splash)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/wmapi\\.meituan\\.com\\/api\\/v\\d+\\/(?:ad|loadInfo|startpicture|openscreen)(?:[/?]|$)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/apimobile\\.meituan\\.com\\/(?:group\\/v\\d+\\/ad|abtest\\/v\\d+\\/ad|appupdate\\/legacy\\/check)(?:[/?]|$)"
    location: "http://reject-dict/"
