#=======================================================================================
# Delivery Clean — Egern 模块
#
# 美团、饿了么、京东去开屏、弹窗浮层与信息流 CPC/CPM 推广卡片。
#=======================================================================================

name: "Delivery Clean"
description: "美团、饿了么、京东去开屏、弹窗与信息流推广卡片。"
author: "xzavier-amico"
homepage: "https://github.com/xzavier-amico/modules"
icon: "https://raw.githubusercontent.com/xzavier-amico/modules/master/icon/delivery.png"

env_schema:
  block_ads:
    name: "去广告"
    description: "过滤美团、饿了么、京东的开屏、弹窗浮层与商家/商品流里的竞价推广卡片"
    default_value: "true"
    options: ["true", "false"]
  clean_ui:
    name: "精简金融楼层"
    description: "在京东「我的」页额外隐藏白条、金条、借钱等金融营销楼层"
    default_value: "false"
    options: ["true", "false"]

