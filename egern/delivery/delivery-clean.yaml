description: "京东、淘宝、拼多多、美团、饿了么、菜鸟裹裹、丰巢去开屏、弹窗浮层与信息流竞价推广卡片。"
author: "xzavier-amico"
homepage: "https://github.com/xzavier-amico/modules"
icon: "https://raw.githubusercontent.com/xzavier-amico/modules/master/icon/delivery.png"

env_schema:
  block_ads:
    name: "去购物与快递广告"
    description: "过滤京东、淘宝、拼多多、美团、饿了么、菜鸟裹裹、丰巢的开屏、取件页弹窗浮层与搜索/推荐流里的 CPC/CPM/P4P 竞价广告"
    default_value: "true"
    options: ["true", "false"]
  clean_ui:
    name: "精简金融与娱乐模块"
    description: "隐藏京东白条/金条/借钱、淘宝借钱/小游戏、拼多多多多视频/大转盘、菜鸟裹酱/果园/商品流等营销模块"
    default_value: "true"
    options: ["true", "false"]

