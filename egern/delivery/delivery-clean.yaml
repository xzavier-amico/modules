url_rewrites:
  - match: "^https?:\\/\\/wmapi\\.meituan\\.com\\/api\\/v\\d+\\/(?:ad|loadInfo|startpicture|openscreen)(?:[/?]|$)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/apimobile\\.meituan\\.com\\/(?:group\\/v\\d+\\/ad|abtest\\/v\\d+\\/ad|appupdate\\/legacy\\/check)(?:[/?]|$)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/mapi\\.meituan\\.com\\/(?:launch\\/v\\d+\\/ad|v\\d+\\/ad)(?:[/?]|$)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/s3plus\\.meituan\\.net\\/v1\\/mss_[^/]+\\/linglong\\/"
    location: "http://reject/"
  - match: "^https?:\\/\\/waimai-guide\\.ele\\.me\\/h5\\/mtop\\.alsc\\.waimai\\.ad\\."
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/api\\.m\\.jd\\.com\\/client\\.action\\?.*functionId=(?:deliverLayer|popupConfig|adStart|getAdList)\\b"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/api\\.smart\\.jd\\.com\\/c\\/service\\/getLoadingLinks\\b"
    location: "http://reject-dict/"

scriptings:
  - http_response:
      name: "delivery.clean"
      match: "^https?:\\/\\/(?:api\\.m\\.jd\\.com\\/client\\.action\\?.*functionId=(?:start|home_launchConfig|splash|welcomeHome|personinfoBusiness|search|uniformRecommend|wareBusiness)|(?:wmapi|apimobile|mapi)\\.meituan\\.com\\/(?:api|group)\\/v\\d+\\/|wx\\.waimai\\.meituan\\.com\\/weapp\\/v\\d+\\/|waimai-guide\\.ele\\.me\\/h5\\/mtop\\.)"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/delivery/js/delivery_clean.js?v=20261123-1"
      body_required: true
      max_size: 8388608
      timeout: 20

mitm:
  hostnames:
    includes:
      - "api.m.jd.com"
      - "api.smart.jd.com"
      - "wmapi.meituan.com"
      - "apimobile.meituan.com"
      - "mapi.meituan.com"
      - "wx.waimai.meituan.com"
      - "s3plus.meituan.net"
      - "waimai-guide.ele.me"
