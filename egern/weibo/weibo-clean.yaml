#=======================================================================================
# Weibo Clean — Egern 模块
#
# 微博去开屏、时间线推广、评论区软广、商业热搜与「我的」页任务中心/钱包营销卡片。
#=======================================================================================

name: "Weibo Clean"
description: "微博去开屏、时间线推广、评论区软广、商业热搜与「我的」页任务中心/钱包营销卡片。"
author: "xzavier-amico"
homepage: "https://github.com/xzavier-amico/modules"
icon: "https://raw.githubusercontent.com/xzavier-amico/modules/master/icon/weibo.png"

env_schema:
  block_ads:
    name: "去广告"
    description: "过滤微博开屏、推荐/关注时间线、评论区软广、发现页商业热搜及活动横幅"
    default_value: "true"
    options: ["true", "false"]
  clean_ui:
    name: "净化我的页"
    description: "在「我的」页采用核心功能白名单，彻底隐藏任务中心、红包签到、我的钱包、借钱、游戏、直播、免费小说、商城等杂乱卡片"
    default_value: "true"
    options: ["true", "false"]

rules:
  - and:
      match:
        - domain_suffix:
            match: "weibo.cn"
        - protocol:
            match: quic
      policy: REJECT
  - and:
      match:
        - domain_suffix:
            match: "weibo.com"
        - protocol:
            match: quic
      policy: REJECT
  - and:
      match:
        - domain_suffix:
            match: "weibocdn.com"
        - protocol:
            match: quic
      policy: REJECT
  - and:
      match:
        - domain_suffix:
            match: "sinaimg.cn"
        - protocol:
            match: quic
      policy: REJECT
  - domain_suffix:
      match: "uve.weibo.com"
      policy: REJECT
  - domain:
      match: "ad.weibo.com"
      policy: REJECT
  - domain:
      match: "adstrategy.biz.weibo.com"
      policy: REJECT
  - domain:
      match: "aln.uve.weibo.com"
      policy: REJECT
  - domain:
      match: "biz.weibo.com"
      policy: REJECT
  - domain:
      match: "dp.im.weibo.cn"
      policy: REJECT
  - domain:
      match: "game.weibo.cn"
      policy: REJECT
  - domain:
      match: "game.weibo.com"
      policy: REJECT
  - domain:
      match: "gw5.push.mcp.weibo.cn"
      policy: REJECT
  - domain:
      match: "gw6.push.mcp.weibo.cn"
      policy: REJECT
  - domain:
      match: "logmix.sina.cn"
      policy: REJECT
  - domain:
      match: "pay.sc.weibo.com"
      policy: REJECT
  - domain:
      match: "promote.biz.weibo.cn"
      policy: REJECT
  - domain:
      match: "sdkapp.uve.weibo.com"
      policy: REJECT
  - domain:
      match: "sdkclick.mobile.sina.cn"
      policy: REJECT
  - domain:
      match: "trends.mobile.sina.cn"
      policy: REJECT
  - domain:
      match: "u1.img.mobile.sina.cn"
      policy: REJECT
  - domain:
      match: "wax.weibo.com"
      policy: REJECT
  - domain:
      match: "zymo.mps.weibo.com"
      policy: REJECT

url_rewrites:
  - match: "^https?:\\/\\/[^/]*uve\\.weibo\\.com\\/"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/[^/]*weibo\\.c(?:n|om)\\/2\\/(?:ad|sdk|preload|checkin|floater|pullad)\\/"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/[^/]*weibo\\.c(?:n|om)\\/2\\/statuses\\/unread_hot_timeline_ad\\b"
    location: "http://reject-dict/"

header_rewrites:
  - delete:
      match: "^https?:\\/\\/[^/]*weibo\\.c(?:n|om)\\/2\\/(?:profile\\/|users\\/|search\\/|page|cardlist|container\\/)"
      name: "if-none-match"
      type: "request"
  - delete:
      match: "^https?:\\/\\/[^/]*weibo\\.c(?:n|om)\\/2\\/(?:profile\\/|users\\/|search\\/|page|cardlist|container\\/)"
      name: "if-modified-since"
      type: "request"

scriptings:
  - http_response:
      name: "weibo.clean"
      match: "^https?:\\/\\/(?:[\\w-]+\\.)?(?:api|m|mapi)\\.weibo\\.c(?:n|om)\\/(?:wbapplua\\/wbpullad\\.lua|2\\/(?:push\\/active|client\\/|checkin\\/|statuses\\/|groups\\/timeline|video\\/|comments\\/build_comments|search\\/|container\\/|page|cardlist|profile\\/|users\\/show))"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/weibo/js/weibo_clean.js?v=20261123-3"
      body_required: true
      max_size: 8388608
      timeout: 20

mitm:
  hostnames:
    includes:
      - "api.weibo.cn"
      - "*.api.weibo.cn"
      - "m.weibo.cn"
      - "mapi.weibo.com"
      - "*.uve.weibo.com"
      - "sdkapp.uve.weibo.com"
