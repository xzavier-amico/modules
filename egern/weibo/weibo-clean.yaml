#=======================================================================================
# Weibo Clean — Egern 模块
#
# 微博去开屏、时间线与评论区广告；极简发现页（仅留纯净热搜，去横幅与下方 feed 流）、清空视频页推荐流，以及极简「我的」页（去超话社区/更多功能/任务中心/钱包）。
#=======================================================================================

name: "Weibo Clean"
description: "微博去开屏、时间线与评论区广告；极简发现页（仅留纯净热搜）、清空视频页推荐流与极简「我的」页。"
author: "xzavier-amico"
homepage: "https://github.com/xzavier-amico/modules"
icon: "https://raw.githubusercontent.com/xzavier-amico/modules/master/icon/weibo.png"

env_schema:
  block_ads:
    name: "去广告"
    description: "过滤微博开屏、推荐/关注时间线、正文详情、评论区软广、商业热搜及综合搜索广告"
    default_value: "true"
    options: ["true", "false"]
  clean_ui:
    name: "极简界面"
    description: "发现页仅保留热搜（清空下方横幅与全部 feed 流）；清空视频页推荐流；「我的」页移除超话社区、更多功能、任务中心、红包签到、钱包、借钱与游戏卡片"
    default_value: "true"
    options: ["true", "false"]

rules:
  - and:
      match:
        - domain_suffix:
            match: "weibo.cn"
        - protocol:
            match: quic
      policy: REJECT
  - and:
      match:
        - domain_suffix:
            match: "weibo.com"
        - protocol:
            match: quic
      policy: REJECT
  - and:
      match:
        - domain_suffix:
            match: "weibocdn.com"
        - protocol:
            match: quic
      policy: REJECT
  - and:
      match:
        - domain_suffix:
            match: "sinaimg.cn"
        - protocol:
            match: quic
      policy: REJECT
  - domain:
      match: "dns.weibo.cn"
      policy: REJECT
  - ip_cidr:
      match: "39.97.128.148/32"
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      match: "39.97.130.51/32"
      policy: REJECT
      no_resolve: true
  - domain:
      match: "aln.uve.weibo.com"
      policy: REJECT
  - domain:
      match: "click.uve.weibo.com"
      policy: REJECT
  - domain:
      match: "datacollection.uve.weibo.com"
      policy: REJECT
  - domain:
      match: "fastimage.uve.weibo.com"
      policy: REJECT
  - domain:
      match: "adimg.uve.weibo.com"
      policy: REJECT
  - domain:
      match: "ad.weibo.com"
      policy: REJECT
  - domain:
      match: "adstrategy.biz.weibo.com"
      policy: REJECT
  - domain:
      match: "alitui.weibo.com"
      policy: REJECT
  - domain:
      match: "biz.weibo.com"
      policy: REJECT
  - domain:
      match: "tui.weibo.com"
      policy: REJECT
  - domain:
      match: "dp.im.weibo.cn"
      policy: REJECT
  - domain:
      match: "game.weibo.cn"
      policy: REJECT
  - domain:
      match: "game.weibo.com"
      policy: REJECT
  - domain:
      match: "gw5.push.mcp.weibo.cn"
      policy: REJECT
  - domain:
      match: "gw6.push.mcp.weibo.cn"
      policy: REJECT
  - domain:
      match: "logmix.sina.cn"
      policy: REJECT
  - domain:
      match: "pay.sc.weibo.com"
      policy: REJECT
  - domain:
      match: "promote.biz.weibo.cn"
      policy: REJECT
  - domain:
      match: "sdkclick.mobile.sina.cn"
      policy: REJECT
  - domain:
      match: "trends.mobile.sina.cn"
      policy: REJECT
  - domain:
      match: "u1.img.mobile.sina.cn"
      policy: REJECT
  - domain:
      match: "wax.weibo.com"
      policy: REJECT
  - domain:
      match: "zymo.mps.weibo.com"
      policy: REJECT
  - domain:
      match: "adpinpai.video.weibocdn.com"
      policy: REJECT

url_rewrites:
  - match: "^https?:\\/\\/[^/]*weibo\\.c(?:n|om)\\/(?:2\\/)?httpdns\\/config"
    location: "http://reject/"
  - match: "^https?:\\/\\/bootrealtime\\.uve\\.weibo\\.com\\/v\\d+\\/ad\\/realtime"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/sdkapp\\.uve\\.weibo\\.com\\/interface\\/sdk\\/(?:get-lbs-cell-info|sdkconfig)\\.php"
    location: "http://reject/"
  - match: "^https?:\\/\\/[^/]*weibo\\.c(?:n|om)\\/2\\/(?:ug\\/checkin\\/list|push\\/daily|push\\/info|logservice\\/service|statuses\\/unread_hot_timeline_ad|statuses\\/container_positive|statuses\\/push_info|comments\\/bullet_screens|video\\/(?:redpacket|remind_info)|hot\\/hours_spotlight|search\\/container_discover|profile\\/recommend_popuser|!\\/live\\/media_homelist|!\\/chaohua\\/discovery\\/home_bottom\\/switch|!\\/huati\\/(?:discovery_home_bottom_getdotinfo|mobile_discovery_searchchange)|!\\/was\\/finder\\/searchbarchange|!\\/wbox\\/\\w+\\/(?:home_bottom_modal|interest_category)|(?:ad|sdk|preload|floater|pullad)\\/)"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/api\\.weibo\\.cn\\/!\\/sug\\/list\\/finderchange\\b"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/(?:card\\.weibo\\.com\\/article\\/m\\/aj|weibo\\.com\\/ttarticle\\/x\\/m\\/aj)\\/(?:reward|uvead)\\b"
    location: "http://reject-dict/"

header_rewrites:
  - delete:
      match: "^https?:\\/\\/[^/]*weibo\\.c(?:n|om)\\/2\\/(?:profile\\/|users\\/|search\\/|searchall|flowpage|page|cardlist|container\\/|video\\/|statuses\\/video_mixtimeline)"
      name: "if-none-match"
      type: "request"
  - delete:
      match: "^https?:\\/\\/[^/]*weibo\\.c(?:n|om)\\/2\\/(?:profile\\/|users\\/|search\\/|searchall|flowpage|page|cardlist|container\\/|video\\/|statuses\\/video_mixtimeline)"
      name: "if-modified-since"
      type: "request"

scriptings:
  - http_response:
      name: "weibo.splash"
      match: "^https?:\\/\\/(?:(?:sdk|wb)app|bootpreload)\\.uve\\.weibo\\.com\\/(?:interface\\/sdk\\/sdkad\\.php|wbapplua\\/wbpullad\\.lua|preload\\/get_ad|v\\d+\\/ad\\/preload)"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/weibo/js/weibo_clean.js?v=20261124-2"
      body_required: true
      max_size: 8388608
      timeout: 20
  - http_response:
      name: "weibo.clean"
      match: "^https?:\\/\\/(?:[\\w-]+\\.)?(?:api|m|mapi)\\.weibo\\.c(?:n|om)\\/2\\/(?:push\\/active|client\\/|checkin\\/show|ug\\/checkin\\/stream|statuses\\/|groups\\/(?:timeline|allgroups\\/v2)|video\\/|comments\\/(?:build_comments|mix_comments)|search\\/|searchall|flowpage|flowlist|container\\/|page|cardlist|profile\\/|users\\/show|direct_messages\\/user_list|messageflow\\/notice|!\\/huati\\/discovery_home_bottom_channels)"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/weibo/js/weibo_clean.js?v=20261124-2"
      body_required: true
      max_size: 8388608
      timeout: 20

mitm:
  hostnames:
    includes:
      - "*.weibo.cn"
      - "*.api.weibo.cn"
      - "*.uve.weibo.com"
      - "*.weibo.com"
      - "weibo.com"
