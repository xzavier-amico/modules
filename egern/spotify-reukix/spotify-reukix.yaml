#=======================================================================================
# Spotify AD (Reukix) — Egern 模块
# 多脚本版本：search / scroll / gabo / proto
#=======================================================================================

name: "Spotify AD (Reukix)"
description: "Spotify 去广告（Reukix 多脚本版）。"
author: "app2smile, Reukix"
homepage: "https://github.com/Reukix/ukix"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Spotify.png"

# URL Rewrite
url_rewrites:
  - match: "^https:\\/\\/(?:spclient\\.wg|[a-z0-9]+-spclient)\\.spotify\\.com(?::443)?\\/pendragon"
    location: "http://reject/"
  - match: "^https:\\/\\/.*-spclient\\.spotify\\.com(?::443)?\\/pam-view-service\\/"
    location: "http://reject/"
  - match: "^https:\\/\\/.*37i9dQZF1EYkqdzj48dyYq"
    location: "http://reject/"

# Header Rewrite: delete if-none-match on user-customization-service
header_rewrites:
  - delete:
      match: "^https:\\/\\/(?:spclient\\.wg\\.spotify\\.com|.*-spclient\\.spotify\\.com(?::443)?)\\/user-customization-service\\/v1\\/customize$"
      name: "if-none-match"
      type: "request"

scriptings:
  # search
  - http_response:
      name: "spotify.search"
      match: "^https:\\/\\/(?:spclient\\.wg\\.spotify\\.com|.*-spclient\\.spotify\\.com(?::443)?)\\/browsita\\/v.\\/browse"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify-reukix/js/Spotify-search.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 30
  # scroll
  - http_response:
      name: "spotify.scroll"
      match: "^https:\\/\\/(?:spclient\\.wg\\.spotify\\.com|.*-spclient\\.spotify\\.com(?::443)?)\\/scrollsita\\/v.\\/scroll\\/spotify"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify-reukix/js/Spotify-scroll.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 30
  # gabo (returns empty 200)
  - http_request:
      name: "spotify.gabo"
      match: "^https:\\/\\/(?:.*-spclient\\.spotify\\.com(?::443)?|spclient\\.wg\\.spotify\\.com)\\/gabo-receiver-service"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify-reukix/js/Spotify-gabo.js"
      body_required: false
      timeout: 10
  # proto (main ad removal)
  - http_response:
      name: "spotify.proto"
      match: "^https:\\/\\/(?:spclient\\.wg\\.spotify\\.com|.*-spclient\\.spotify\\.com(?::443)?)\\/(?:bootstrap\\/v1\\/bootstrap|user-customization-service\\/v1\\/customize)$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/spotify-reukix/js/Spotify-proto.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 60

mitm:
  hostnames:
    includes:
      - "spclient.wg.spotify.com"
      - "*spclient.spotify.com"
