#=======================================================================================
# YouTube Enhance — Egern 模块
#
# 由 Surge 模块 youtube-enhance.sgmodule (https://github.com/gholts/surge) 转换而来。
# 脚本直接复用 gholts 原版 Surge JS（js/ 子目录），不加任何包装：
#   Egern 对这类脚本按「Surge 兼容模式」运行（$request / $response / $done /
#   $persistentStore 全局变量可用），参数通过 env 的 _compat.$argument 传入，
#   与 IBL3ND 的 Egern-YouTube.yaml 采用同一套已验证范式。
#
# Surge → Egern 字段对照:
#   [Script] type=http-request / http-response      → scriptings[].http_request / http_response
#   pattern=...                                     → match
#   script-path=...                                 → script_url （本模块已托管在 GitHub，直接用 raw 绝对路径;
#                                                      若改为纯本地导入/本地路径引用，可换回相对路径 js/xxx.js）
#   requires-body=1,binary-body-mode=1              → body_required: true + binary_body: true
#   max-size=-1（不限制）                            → max_size: 33554432 （显式大值。注意: 文档默认 1 MiB
#                                                      = 1048576; "0 = 不限制"的语义官方未定义，勿依赖）
#   argument="{"flag":...}"                         → env._compat.$argument （原样的 JSON，内嵌三花括号占位符）
#   #!arguments / #!arguments-desc                  → compat_arguments / compat_arguments_desc
#   模块设置页开关                                   → compat_arguments_schema
#   #!REQUIREMENT "'...' == 'true'"（auto_hd 门控）  → 无按参数条件启用的能力；request.js 内部
#                                                      本就按 autoHd 自行判断，脚本常开无副作用
#   [URL Rewrite] ... - reject                      → rewrites[].actions[].respond {status: 404}
#   [MITM] hostname = %APPEND% ...                  → mitm.hostnames.includes
#
# 注意:
#   - 需在 Egern 中安装并信任 CA 证书并开启 MITM（HTTPS 改写必需）。
#   - 各脚本共用持久化键 "YouTubeConfig"（client/encrypt）与 "YouTubeQuality"（分辨率缓存），
#     key.js → ump.js 之间有数据依赖，请勿单独删改。
#=======================================================================================

name: "YouTube Enhance"
description: "去广告 + 后台播放 + PiP + 最高 4x 倍速 + On-the-go 控件。\n基于 Maasea 的代码 (Apache-2.0)，由 Surge 模块 youtube-enhance.sgmodule 转换。"
author: "gholts"
homepage: "https://github.com/gholts/surge"
manual: "https://raw.githubusercontent.com/gholts/surge/main/modules/youtube-enhance.sgmodule"
# 图标改用本仓库托管的同一张图（Yuanxsxs 原图的本地备份，不依赖上游是否删图）；
# 想换回原图可改: https://raw.githubusercontent.com/Yuanxsxs/QtumultX/master/Icon/Hand-Painted-icon/Social_Media/YouTube.png
# 或改回内置符号图标: icon: "play.rectangle.fill"
icon: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/icon/YouTube.png"

# ---- 参数（与 Surge #!arguments 一致的默认值，snake_case 键名以三花括号占位符注入）----
compat_arguments:
  block_upload: "true"
  block_shorts: "false"
  auto_hd: "true"
  block_games: "true"
  block_vertical_live: "false"
  jump_ahead: "true"
  block_store: "true"
  block_ai: "true"
  on_the_go: "true"

compat_arguments_desc: |
  block_upload          — 移除「上传」标签 tab
  block_shorts          — 移除 Shorts 标签 tab
  auto_hd               — 优先选择最高分辨率（已授权时用 Premium 高码率）
  block_games           — 移除首页 Playables（小游戏）
  block_vertical_live   — 移除首页竖屏直播
  jump_ahead            — 启用 Jump Ahead 按钮
  block_store           — 移除创作者商店/商品卡/悬浮层
  block_ai              — 移除 Ask/AI 摘要及相关控件
  on_the_go             — 在兼容 UI 组件可用时启用 On-the-go 控件

# ---- 模块设置页 UI（Toggle 开关）----
compat_arguments_schema:
  block_upload:
    name: "Remove upload tab"
    description: "移除「上传」标签页"
    options: ["true", "false"]
  block_shorts:
    name: "Remove Shorts tab"
    description: "移除 Shorts 标签页"
    options: ["true", "false"]
  auto_hd:
    name: "Auto HD"
    description: "优先最高分辨率；已授权 Premium 时使用高码率"
    options: ["true", "false"]
  block_games:
    name: "Remove Playables"
    description: "移除首页小游戏（Playables）"
    options: ["true", "false"]
  block_vertical_live:
    name: "Remove vertical live"
    description: "移除首页竖屏直播"
    options: ["true", "false"]
  jump_ahead:
    name: "Jump Ahead button"
    description: "启用 Jump Ahead 按钮"
    options: ["true", "false"]
  block_store:
    name: "Remove creator stores"
    description: "移除创作者商店、商品卡片与悬浮层"
    options: ["true", "false"]
  block_ai:
    name: "Remove Ask / AI"
    description: "移除 Ask、AI 摘要及相关控件"
    options: ["true", "false"]
  on_the_go:
    name: "On-the-go controls"
    description: "在兼容 UI 组件可用时启用 On-the-go 控件"
    options: ["true", "false"]

# ---- 脚本（Surge [Script] 原样翻译；脚本即 js/ 下的 Surge 原版，无需包装）----
scriptings:
  # youtube.enhance.ad-break：拦截 ad_break，返回空 protobuf
  - http_request:
      name: "youtube.enhance.ad-break"
      match: "^https://youtubei\\.googleapis\\.com/youtubei/v1/player/ad_break(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/request.js"

  # youtube.enhance.response：改写 browse/next/player 等响应（9 个开关全量注入）
  # 注: 原版 match 还包含 guide / account/get_setting —— 「我的」页打不开的最可能元凶,
  #     现暂时摘除以隔离问题（列表秒杀/首页/播放页不受影响）。日志显示该两路由无异常后,
  #     可把 |guide|account/get_setting 加回:
  #     ^https://youtubei\.googleapis\.com/youtubei/v1/(?:navigation/resolve_url|browse|next|player|search|reel/reel_watch_sequence|guide|account/get_setting|get_watch)(?:\?.*)?$
  - http_response:
      name: "youtube.enhance.response"
      match: "^https://youtubei\\.googleapis\\.com/youtubei/v1/(?:navigation/resolve_url|browse|next|player|search|reel/reel_watch_sequence|get_watch)(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/response.js"
      body_required: true
      binary_body: true
      max_size: 33554432    # 32 MiB（0 的语义文档未定义，显式大值；默认 1 MiB 会截断大响应）
      env:
        _compat.$argument: '{"blockUpload":{{{block_upload}}},"blockShorts":{{{block_shorts}}},"blockGames":{{{block_games}}},"blockVerticalLive":{{{block_vertical_live}}},"jumpAhead":{{{jump_ahead}}},"autoHd":{{{auto_hd}}},"blockStore":{{{block_store}}},"blockAi":{{{block_ai}}},"onTheGo":{{{on_the_go}}}}'

  # youtube.enhance.key：从 config/log_event 提取 client/encrypt 密钥（ump 解密依赖）
  - http_response:
      name: "youtube.enhance.key"
      match: "^https://youtubei\\.googleapis\\.com/youtubei/v1/(?:config|log_event)(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/key.js"
      body_required: true
      binary_body: true
      max_size: 33554432

  # youtube.enhance.ump：解密/改写 initplayback 的 UMP（AES+SHA256+gzip,较重）
  # 脚本内部自带 16 MiB 解压上限；此处引擎层给 32 MiB 留出余量
  - http_response:
      name: "youtube.enhance.ump"
      match: "^https?://[\\w-]+\\.googlevideo\\.com/initplayback(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/ump.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 30
      env:
        _compat.$argument: '{"blockGames":{{{block_games}}},"blockVerticalLive":{{{block_vertical_live}}},"jumpAhead":{{{jump_ahead}}},"autoHd":{{{auto_hd}}},"blockStore":{{{block_store}}},"blockAi":{{{block_ai}}},"onTheGo":{{{on_the_go}}}}'

  # youtube.enhance.init：initplayback 请求改写
  - http_request:
      name: "youtube.enhance.init"
      match: "^https?://[\\w-]+\\.googlevideo\\.com/initplayback(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/request.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      env:
        _compat.$argument: '{"autoHd":{{{auto_hd}}}}'

  # youtube.enhance.auto-hd：videoplayback 请求改写（auto_hd=false 时脚本内部自判、不改写）
  - http_request:
      name: "youtube.enhance.auto-hd"
      match: "^https?://[\\w-]+\\.googlevideo\\.com/videoplayback(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/request.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      env:
        _compat.$argument: '{"autoHd":{{{auto_hd}}}}'

  # youtube.enhance.log-event：剥除热更新 hash 响应头
  - http_request:
      name: "youtube.enhance.log-event"
      match: "^https://youtubei\\.googleapis\\.com/youtubei/v1/log_event(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/request.js"

# ---- URL Rewrite（Surge 的 - reject → respond 404 空响应）----
rewrites:
  - match: "^https://www\\.youtube\\.com/(pagead|pcs)/"
    actions:
      - respond:
          status: 404
  - match: "^https://s\\.youtube\\.com/api/stats/ads"
    actions:
      - respond:
          status: 404

# ---- MITM（Surge [MITM] hostname %APPEND% 直译）----
mitm:
  hostnames:
    includes:
      - "*.googlevideo.com"
      - "youtubei.googleapis.com"
      - "www.youtube.com"
      - "s.youtube.com"
