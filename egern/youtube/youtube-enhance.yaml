# ---- 脚本（Surge [Script] 原样翻译；脚本即 js/ 下的 Surge 原版，无需包装）----
scriptings:
  # youtube.enhance.ad-break：拦截 ad_break，返回空 protobuf
  - http_request:
      name: "youtube.enhance.ad-break"
      match: "^https://youtubei\\.googleapis\\.com/youtubei/v1/player/ad_break(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/request.js"
      timeout: 30
      env:
        _compat.$argument: '{"blockPlayerAds":{{{block_player_ads}}}}'

  # youtube.enhance.response：改写 browse/next/player 等响应（全部参数注入，脚本按需读取）
  # 路由 A/B 测试记录:
  #   [A] 原版全量 match（当前, 含 guide / account/get_setting）—— 保留原版全部功能
  #       （隐藏上传 tab 等), 正在验证「我的」页是否与之共存:
  #       ^https://youtubei\.googleapis\.com/youtubei/v1/(?:navigation/resolve_url|browse|next|player|search|reel/reel_watch_sequence|guide|account/get_setting|get_watch)(?:\?.*)?$
  #   [B] 缩窄 match（摘除 guide / account/get_setting）—— 已验证: 主页/「我的」页/后台播放
  #       均正常, 但丢失这两条路由上的过滤效果。若 [A] 下「我的」页复发, 把下面 match
  #       换回 [B] 即秒回可用版:
  #       ^https://youtubei\.googleapis\.com/youtubei/v1/(?:navigation/resolve_url|browse|next|player|search|reel/reel_watch_sequence|get_watch)(?:\?.*)?$
  - http_response:
      name: "youtube.enhance.response"
      match: "^https://youtubei\\.googleapis\\.com/youtubei/v1/(?:navigation/resolve_url|browse|next|player|search|reel/reel_watch_sequence|guide|account/get_setting|get_watch)(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/response.js"
      body_required: true
      binary_body: true
      max_size: 33554432    # 32 MiB（0 的语义文档未定义，显式大值；默认 1 MiB 会截断大响应）
      timeout: 60
      env:
        _compat.$argument: '{"blockUpload":{{{block_upload}}},"blockShorts":{{{block_shorts}}},"autoHd":{{{auto_hd}}},"blockGames":{{{block_games}}},"blockVerticalLive":{{{block_vertical_live}}},"jumpAhead":{{{jump_ahead}}},"blockStore":{{{block_store}}},"blockAi":{{{block_ai}}},"onTheGo":{{{on_the_go}}},"backgroundPlay":{{{background_play}}},"pip":{{{pip}}},"maxSpeed":"{{{max_speed}}}","hidePremium":{{{hide_premium}}},"preferPremium":{{{prefer_premium}}},"maxHeight":{{{max_height}}},"blockPlayerAds":{{{block_player_ads}}},"blockFeedAds":{{{block_feed_ads}}},"blockShortsFeed":{{{block_shorts_feed}}},"blockMembersOnly":{{{block_members_only}}},"blockShortsAds":{{{block_shorts_ads}}},"removePaidPromotion":{{{remove_paid_promotion}}},"blockAdTracking":{{{block_ad_tracking}}},"blockGuideItems":"{{{block_guide_items}}}","onTheGoAudio":{{{on_the_go_audio}}},"onTheGoChapters":{{{on_the_go_chapters}}},"stripHotHash":{{{strip_hot_hash}}}}'

  # youtube.enhance.key：从 config/log_event 提取 client/encrypt 密钥（ump 解密依赖）
  - http_response:
      name: "youtube.enhance.key"
      match: "^https://youtubei\\.googleapis\\.com/youtubei/v1/(?:config|log_event)(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/key.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 30

  # youtube.enhance.ump：解密/改写 initplayback 的 UMP（AES+SHA256+gzip,较重）
  # 脚本内部自带 16 MiB 解压上限；此处引擎层给 32 MiB 留出余量
  - http_response:
      name: "youtube.enhance.ump"
      match: "^https?://[\\w-]+\\.googlevideo\\.com/initplayback(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/ump.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 60
      env:
        _compat.$argument: '{"blockGames":{{{block_games}}},"blockVerticalLive":{{{block_vertical_live}}},"jumpAhead":{{{jump_ahead}}},"autoHd":{{{auto_hd}}},"blockStore":{{{block_store}}},"blockAi":{{{block_ai}}},"onTheGo":{{{on_the_go}}},"backgroundPlay":{{{background_play}}},"pip":{{{pip}}},"maxSpeed":"{{{max_speed}}}","hidePremium":{{{hide_premium}}},"preferPremium":{{{prefer_premium}}},"maxHeight":{{{max_height}}},"blockPlayerAds":{{{block_player_ads}}},"blockFeedAds":{{{block_feed_ads}}},"blockShortsFeed":{{{block_shorts_feed}}},"blockMembersOnly":{{{block_members_only}}},"blockShortsAds":{{{block_shorts_ads}}},"removePaidPromotion":{{{remove_paid_promotion}}},"blockAdTracking":{{{block_ad_tracking}}},"blockGuideItems":"{{{block_guide_items}}}","onTheGoAudio":{{{on_the_go_audio}}},"onTheGoChapters":{{{on_the_go_chapters}}},"stripHotHash":{{{strip_hot_hash}}}}'

  # youtube.enhance.init：initplayback 请求改写
  - http_request:
      name: "youtube.enhance.init"
      match: "^https?://[\\w-]+\\.googlevideo\\.com/initplayback(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/request.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 30
      env:
        _compat.$argument: '{"autoHd":{{{auto_hd}}},"preferPremium":{{{prefer_premium}}},"maxHeight":{{{max_height}}}}'

  # youtube.enhance.auto-hd：videoplayback 请求改写（auto_hd=false 时脚本内部自判、不改写）
  - http_request:
      name: "youtube.enhance.auto-hd"
      match: "^https?://[\\w-]+\\.googlevideo\\.com/videoplayback(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/request.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 30
      env:
        _compat.$argument: '{"autoHd":{{{auto_hd}}},"preferPremium":{{{prefer_premium}}},"maxHeight":{{{max_height}}}}'

  # youtube.enhance.log-event：剥除热更新 hash 响应头
  - http_request:
      name: "youtube.enhance.log-event"
      match: "^https://youtubei\\.googleapis\\.com/youtubei/v1/log_event(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/request.js"
      timeout: 30
      env:
        _compat.$argument: '{"stripHotHash":{{{strip_hot_hash}}}}'

# ---- URL Rewrite（Surge 的 - reject → respond 404 空响应）----
rewrites:
  - match: "^https://www\\.youtube\\.com/(pagead|pcs)/"
    actions:
      - respond:
          status: 404
  - match: "^https://s\\.youtube\\.com/api/stats/ads"
    actions:
      - respond:
          status: 404

# ---- MITM（Surge [MITM] hostname %APPEND% 直译）----
mitm:
  hostnames:
    includes:
      - "*.googlevideo.com"
      - "youtubei.googleapis.com"
      - "www.youtube.com"
      - "s.youtube.com"
