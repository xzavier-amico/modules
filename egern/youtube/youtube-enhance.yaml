#=======================================================================================
# YouTube Enhance — Egern 模块
#
# 由 Surge 模块 youtube-enhance.sgmodule (https://github.com/gholts/surge) 转换而来。
# 原始逻辑来自 Maasea 的代码（Apache-2.0），本仓库把原来的 4 个脚本重写并合并为
# js/youtube.js 单文件，按 URL 与方法在脚本内分发：
#   Egern 对这类脚本按「Surge 兼容模式」运行（$request / $response / $done /
#   $persistentStore 全局变量可用），参数通过 env 的 _compat.$argument 传入，
#   采用本模块实测可行的兼容范式。
#
# Surge → Egern 字段对照:
#   [Script] type=http-request / http-response      → scriptings[].http_request / http_response
#   pattern=...                                     → match
#   script-path=...                                 → script_url （本模块已托管在 GitHub，直接用 raw 绝对路径;
#                                                      若改为纯本地导入/本地路径引用，可换回相对路径 js/xxx.js）
#   requires-body=1,binary-body-mode=1              → body_required: true + binary_body: true
#   max-size=-1（不限制）                            → max_size: 33554432 （显式大值。注意: 文档默认 1 MiB
#                                                      = 1048576; "0 = 不限制"的语义官方未定义，勿依赖）
#   argument="{"flag":...}"                         → env._compat.$argument （原样的 JSON，内嵌三花括号占位符）
#   #!arguments / #!arguments-desc                  → compat_arguments / compat_arguments_desc
#   模块设置页 UI                                     → compat_arguments_schema（开关/选择器/输入框）
#   #!REQUIREMENT "'...' == 'true'"（auto_hd 门控）  → 无按参数条件启用的能力；request.js 内部
#                                                      本就按 autoHd 自行判断，脚本常开无副作用
#   [URL Rewrite] ... - reject                      → rewrites[].actions[].respond {status: 404}
#   [MITM] hostname = %APPEND% ...                  → mitm.hostnames.includes
#
# 注意:
#   - 需在 Egern 中安装并信任 CA 证书并开启 MITM（HTTPS 改写必需）。
#   - 脚本内部共用持久化键 "YouTubeConfig"（client/encrypt）与 "YouTubeQuality"（分辨率缓存），
#     密钥提取与 UMP 解密有先后依赖，第一次播放后才会生效。
#=======================================================================================

name: "YouTube Enhance"
description: "去广告 + 后台播放 + PiP + 最高 4x 倍速 + On-the-go 控件。\n脚本已重写并合并为单文件；原始逻辑来自 Maasea 的代码 (Apache-2.0)。"
author: "xzavier-amico"
homepage: "https://github.com/xzavier-amico/modules"
manual: "https://github.com/xzavier-amico/modules/blob/master/egern/youtube/README.md"
# 图标改用本仓库托管的同一张图（Yuanxsxs 原图的本地备份，不依赖上游是否删图）；
# 想换回原图可改: https://raw.githubusercontent.com/Yuanxsxs/QtumultX/master/Icon/Hand-Painted-icon/Social_Media/YouTube.png
# 或改回内置符号图标: icon: "play.rectangle.fill"
icon: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/icon/YouTube.png"

# ---- 参数（与 Surge #!arguments 一致的默认值，snake_case 键名以三花括号占位符注入）----
compat_arguments:
  block_upload: "true"
  block_shorts: "false"
  block_shorts_feed: "false"
  block_members_only: "false"
  auto_hd: "true"
  block_games: "true"
  block_vertical_live: "false"
  jump_ahead: "true"
  block_store: "true"
  block_ai: "true"
  on_the_go: "true"
  background_play: "true"
  pip: "true"
  max_speed: "4"
  hide_premium: "true"
  prefer_premium: "true"
  max_height: "4320"
  block_player_ads: "true"
  block_feed_ads: "true"
  block_shorts_ads: "true"
  remove_paid_promotion: "true"
  block_ad_tracking: "true"
  block_guide_items: ""
  on_the_go_audio: "true"
  on_the_go_chapters: "true"
  strip_hot_hash: "true"

compat_arguments_desc: |
  block_upload          — 移除侧栏中的「上传」入口
  block_shorts          — 移除侧栏中的 Shorts 入口
  block_shorts_feed     — 移除首页列表中的 Shorts 推荐货架
  block_members_only    — 移除首页、频道页等列表中需要频道会员才能观看的视频
  auto_hd               — 优先选择可用的最高分辨率（已授权时用 Premium 高码率）
  block_games           — 移除首页 Playables（小游戏）
  block_vertical_live   — 移除首页竖屏直播
  jump_ahead            — 启用播放器中的 Jump Ahead 快进按钮
  block_store           — 移除创作者商店、商品卡与相关悬浮层
  block_ai              — 移除 Ask、AI 摘要及相关控件
  on_the_go             — 在兼容 UI 组件可用时启用 On-the-go 控件
  background_play       — 启用后台播放，并在设置页强制打开后台播放
  pip                   — 启用画中画（PiP）
  max_speed             — 最大播放倍速：4 / 3 / 2，off 表示不修改倍速数值与上限
  hide_premium          — 隐藏侧栏 Premium 入口和倍速菜单中的 Premium 推广
  prefer_premium        — 自动高清时优先使用 Premium 高码率版本
  max_height            — 自动高清允许的最高分辨率高度，默认 4320
  block_player_ads      — 移除播放器广告位并拦截 ad_break
  block_feed_ads        — 移除首页、搜索和推荐信息流中的广告卡片
  block_shorts_ads      — 移除 Shorts 列表中的广告条目
  remove_paid_promotion — 移除播放器响应中的付费推广与推广内容
  block_ad_tracking     — 移除播放跟踪中的广告转化字段
  block_guide_items     — 额外隐藏的侧栏 browseId，多个用英文逗号分隔
  on_the_go_audio       — 在 On-the-go 控件中加入音频模式切换按钮
  on_the_go_chapters    — 在 On-the-go 控件中加入章节按钮
  strip_hot_hash        — 移除 log_event 中的热更新哈希响应头，避免配置被覆盖

