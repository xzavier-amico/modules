#=======================================================================================
# YouTube Enhance — Egern 模块
#
# 由 Surge 模块 youtube-enhance.sgmodule (https://github.com/gholts/surge) 转换而来。
# 原始逻辑来自 Maasea 的代码（Apache-2.0），本仓库把原来的 4 个脚本重写并合并为
# js/youtube.js 单文件，按 URL 与方法在脚本内分发：
#   Egern 对这类脚本按「Surge 兼容模式」运行（$request / $response / $done /
#   $persistentStore 全局变量可用），参数通过 env 的 _compat.$argument 传入，
#   采用本模块实测可行的兼容范式。
#
# Surge → Egern 字段对照:
#   [Script] type=http-request / http-response      → scriptings[].http_request / http_response
#   pattern=...                                     → match
#   script-path=...                                 → script_url （本模块已托管在 GitHub，直接用 raw 绝对路径;
#                                                      若改为纯本地导入/本地路径引用，可换回相对路径 js/xxx.js）
#   requires-body=1,binary-body-mode=1              → body_required: true + binary_body: true
#   max-size=-1（不限制）                            → max_size: 33554432 （显式大值。注意: 文档默认 1 MiB
#                                                      = 1048576; "0 = 不限制"的语义官方未定义，勿依赖）
#   argument="{"flag":...}"                         → env._compat.$argument （原样的 JSON，内嵌三花括号占位符）
#   #!arguments / #!arguments-desc                  → compat_arguments / compat_arguments_desc
#   模块设置页 UI                                     → compat_arguments_schema（开关/选择器/输入框）
#   #!REQUIREMENT "'...' == 'true'"（auto_hd 门控）  → 无按参数条件启用的能力；request.js 内部
#                                                      本就按 autoHd 自行判断，脚本常开无副作用
#   [URL Rewrite] ... - reject                      → rewrites[].actions[].respond {status: 404}
#   [MITM] hostname = %APPEND% ...                  → mitm.hostnames.includes
#
# 注意:
#   - 需在 Egern 中安装并信任 CA 证书并开启 MITM（HTTPS 改写必需）。
#   - 脚本内部共用持久化键 "YouTubeConfig"（client/encrypt）与 "YouTubeQuality"（分辨率缓存），
#     密钥提取与 UMP 解密有先后依赖，第一次播放后才会生效。
#=======================================================================================

name: "YouTube Enhance"
description: "去广告 + 字幕翻译 + YouTube Music 去广告/后台播放 + 默认分辨率 + 首页菜单/Shorts 过滤 + On-the-go。\n后台播放与 PiP 常开，不再单独设开关。原始逻辑来自 Maasea 的代码 (Apache-2.0)。"
author: "xzavier-amico"
homepage: "https://github.com/xzavier-amico/modules"
manual: "https://github.com/xzavier-amico/modules/blob/master/egern/youtube/README.md"
# 图标使用 Koolson/Qure 的彩色图标集（外链，不依赖本仓库 icon/ 目录）。
# 旧图标仍保留在 icon/YouTube.png 作为备份；想换回可改成本仓库 raw URL。
icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png"

# ---- 参数（snake_case 键名以三花括号占位符注入）----
compat_arguments:
  block_ads: "true"
  block_ai: "true"
  max_height: "max"
  caption_lang: "zh-Hans"
  home_menu: ""
  block_shorts_feed: "false"
  on_the_go: "true"
  youtube_music: "true"
  block_members_only: "false"
  home_cleanup: "standard"
  jump_ahead: "true"
  max_speed: "4"

compat_arguments_desc: |
  block_ads          — 屏蔽广告：播放器 / 信息流 / Shorts / 付费推广 / 广告追踪 / Premium 推广 / 创作者商店
  block_ai           — 移除 Ask、AI 摘要及相关控件
  max_height         — 默认分辨率：max（最高可用）/ 4320 / 2160 / 1440 / 1080 / 720 / 480 / off
  caption_lang       — 字幕默认翻译语言（Google 语言代码，如 zh-Hans、en、ja）；off 关闭
  home_menu          — 首页菜单保留项（多选，逗号分隔）。留空=仅隐藏上传；all=全部保留；
                       none=全部隐藏；-shorts=保留全部但隐藏 Shorts；也可直接写 browseId
  block_shorts_feed  — 移除首页/搜索等信息流中的 Shorts 推荐货架
  on_the_go          — 启用 On-the-go 控件（音频模式与章节按钮一并启用）
  youtube_music      — YouTube Music 增强：去广告、后台播放、PiP
  block_members_only — 从列表页移除需要频道会员才能观看的视频
  home_cleanup       — 首页内容清理：standard=Playables；all=再加竖屏直播；off=不清理
  jump_ahead         — 启用播放器中的 Jump Ahead 快进按钮
  max_speed          — 最大播放倍速：4 / 3 / 2 / off

# ---- 模块设置页 UI（开关 / 选择器 / 输入框）----
compat_arguments_schema:
  block_ads:
    name: "屏蔽广告"
    description: "播放器 / 信息流 / Shorts 广告、付费推广、广告追踪、Premium 推广、创作者商店一次关掉"
    options: ["true", "false"]
  block_ai:
    name: "移除 AI 组件"
    description: "移除 Ask、AI 摘要及相关控件"
    options: ["true", "false"]
  max_height:
    name: "默认分辨率"
    description: "max = 最高可用；off = 不修改画质"
    options: ["max", "4320", "2160", "1440", "1080", "720", "480", "off"]
  caption_lang:
    name: "字幕翻译"
    description: "选择默认翻译语言；off 关闭字幕翻译"
    options: ["zh-Hans", "zh-Hant", "en", "ja", "ko", "es", "fr", "de", "ru", "pt", "it", "vi", "th", "id", "ar", "hi", "tr", "pl", "nl", "off"]
  home_menu:
    name: "首页菜单保留项"
    description: "多选：填写要保留的入口，逗号分隔。留空=仅隐藏上传；all=全部保留；none=全部隐藏；-shorts=保留全部但隐藏 Shorts。支持 upload/shorts/explore/music/history/playlists/downloads/trending/library/later/liked 或 browseId"
    options: []
  block_shorts_feed:
    name: "移除 Shorts 推荐"
    description: "移除首页、搜索和推荐信息流中的 Shorts 货架"
    options: ["true", "false"]
  on_the_go:
    name: "On-The-Go"
    description: "启用 On-the-go 控件，音频模式与章节按钮一并启用"
    options: ["true", "false"]
  youtube_music:
    name: "YouTube Music 增强"
    description: "YouTube Music 去广告、后台播放、PiP"
    options: ["true", "false"]
  block_members_only:
    name: "屏蔽会员专属视频"
    description: "从首页、频道页等列表中移除需要频道会员的视频"
    options: ["true", "false"]
  home_cleanup:
    name: "首页内容清理"
    description: "standard=Playables；all=再加竖屏直播；off=不清理"
    options: ["standard", "all", "off"]
  jump_ahead:
    name: "Jump Ahead 按钮"
    description: "启用播放器中的 Jump Ahead 快进按钮"
    options: ["true", "false"]
  max_speed:
    name: "最大倍速"
    description: "可选 4 / 3 / 2 / off；off 表示不修改倍速数值与上限"
    options: ["4", "3", "2", "off"]

# ---- 脚本（单文件，按 URL 与方法在脚本内分发）----
# 原来 4 个脚本 / 6 条 entry 合并成 1 个脚本 / 3 条 entry：
#   请求阶段一条（ad_break、log_event、initplayback、videoplayback）
#   响应阶段两条（youtubei 各类接口、initplayback 的 UMP）
# 所有参数在每条 entry 里全量注入，脚本按需读取，未用到的键会被忽略。
scriptings:
  # 请求阶段：ad_break 拦截、log_event 剥哈希头、initplayback 校验密钥、videoplayback 改 itag
  - http_request:
      name: "youtube.enhance.request"
      match: "^https://(?:youtubei\\.googleapis\\.com|music\\.youtube\\.com)/youtubei/v1/(?:(?:player|music)/ad_break|log_event)(?:\\?.*)?$|^https?://[\\w-]+\\.googlevideo\\.com/(?:initplayback|videoplayback)(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/youtube.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 30
      env:
        _compat.$argument: '{"blockAds":{{{block_ads}}},"blockAi":{{{block_ai}}},"maxHeight":"{{{max_height}}}","captionLang":"{{{caption_lang}}}","homeMenu":"{{{home_menu}}}","blockShortsFeed":{{{block_shorts_feed}}},"onTheGo":{{{on_the_go}}},"youtubeMusic":{{{youtube_music}}},"blockMembersOnly":{{{block_members_only}}},"homeCleanup":"{{{home_cleanup}}}","jumpAhead":{{{jump_ahead}}},"maxSpeed":"{{{max_speed}}}"}'

  # 响应阶段：browse / next / player 等改写，以及从 config / log_event 抓 UMP 密钥
  - http_response:
      name: "youtube.enhance.response"
      match: "^https://(?:youtubei\\.googleapis\\.com|music\\.youtube\\.com)/youtubei/v1/(?:navigation/resolve_url|browse|next|player|search|reel/reel_watch_sequence|guide|account/get_setting|get_watch|config|log_event)(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/youtube.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 60
      env:
        _compat.$argument: '{"blockAds":{{{block_ads}}},"blockAi":{{{block_ai}}},"maxHeight":"{{{max_height}}}","captionLang":"{{{caption_lang}}}","homeMenu":"{{{home_menu}}}","blockShortsFeed":{{{block_shorts_feed}}},"onTheGo":{{{on_the_go}}},"youtubeMusic":{{{youtube_music}}},"blockMembersOnly":{{{block_members_only}}},"homeCleanup":"{{{home_cleanup}}}","jumpAhead":{{{jump_ahead}}},"maxSpeed":"{{{max_speed}}}"}'

  # 响应阶段：initplayback 的 UMP 解密 → 改写 → 重新加密（较重，单独给 60 秒）
  - http_response:
      name: "youtube.enhance.ump"
      match: "^https?://[\\w-]+\\.googlevideo\\.com/initplayback(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/youtube.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 60
      env:
        _compat.$argument: '{"blockAds":{{{block_ads}}},"blockAi":{{{block_ai}}},"maxHeight":"{{{max_height}}}","captionLang":"{{{caption_lang}}}","homeMenu":"{{{home_menu}}}","blockShortsFeed":{{{block_shorts_feed}}},"onTheGo":{{{on_the_go}}},"youtubeMusic":{{{youtube_music}}},"blockMembersOnly":{{{block_members_only}}},"homeCleanup":"{{{home_cleanup}}}","jumpAhead":{{{jump_ahead}}},"maxSpeed":"{{{max_speed}}}"}'

# ---- URL Rewrite（Surge 的 - reject → respond 404 空响应）----
rewrites:
  - match: "^https://www\\.youtube\\.com/(pagead|pcs)/"
    actions:
      - respond:
          status: 404
  - match: "^https://s\\.youtube\\.com/api/stats/ads"
    actions:
      - respond:
          status: 404

# ---- MITM（Surge [MITM] hostname %APPEND% 直译）----
mitm:
  hostnames:
    includes:
      - "*.googlevideo.com"
      - "youtubei.googleapis.com"
      - "www.youtube.com"
      - "music.youtube.com"
      - "s.youtube.com"
