# ---- 脚本（单文件，按 URL 与方法在脚本内分发）----
# 原来 4 个脚本 / 6 条 entry 合并成 1 个脚本 / 3 条 entry：
#   请求阶段一条（ad_break、log_event、initplayback、videoplayback）
#   响应阶段两条（youtubei 各类接口、initplayback 的 UMP）
# 所有参数在每条 entry 里全量注入，脚本按需读取，未用到的键会被忽略。
scriptings:
  # 请求阶段：ad_break 拦截、log_event 剥哈希头、initplayback 校验密钥、videoplayback 改 itag
  - http_request:
      name: "youtube.enhance.request"
      match: "^https://youtubei\\.googleapis\\.com/youtubei/v1/(?:player/ad_break|log_event)(?:\\?.*)?$|^https?://[\\w-]+\\.googlevideo\\.com/(?:initplayback|videoplayback)(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/youtube.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 30
      env:
        _compat.$argument: '{"blockUpload":{{{block_upload}}},"blockShorts":{{{block_shorts}}},"blockShortsFeed":{{{block_shorts_feed}}},"blockMembersOnly":{{{block_members_only}}},"autoHd":{{{auto_hd}}},"blockGames":{{{block_games}}},"blockVerticalLive":{{{block_vertical_live}}},"jumpAhead":{{{jump_ahead}}},"blockStore":{{{block_store}}},"blockAi":{{{block_ai}}},"onTheGo":{{{on_the_go}}},"backgroundPlay":{{{background_play}}},"pip":{{{pip}}},"hidePremium":{{{hide_premium}}},"preferPremium":{{{prefer_premium}}},"blockPlayerAds":{{{block_player_ads}}},"blockFeedAds":{{{block_feed_ads}}},"blockShortsAds":{{{block_shorts_ads}}},"removePaidPromotion":{{{remove_paid_promotion}}},"blockAdTracking":{{{block_ad_tracking}}},"onTheGoAudio":{{{on_the_go_audio}}},"onTheGoChapters":{{{on_the_go_chapters}}},"stripHotHash":{{{strip_hot_hash}}},"maxSpeed":"{{{max_speed}}}","maxHeight":"{{{max_height}}}","blockGuideItems":"{{{block_guide_items}}}"}'

  # 响应阶段：browse / next / player 等改写，以及从 config / log_event 抓 UMP 密钥
  - http_response:
      name: "youtube.enhance.response"
      match: "^https://youtubei\\.googleapis\\.com/youtubei/v1/(?:navigation/resolve_url|browse|next|player|search|reel/reel_watch_sequence|guide|account/get_setting|get_watch|config|log_event)(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/youtube.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 60
      env:
        _compat.$argument: '{"blockUpload":{{{block_upload}}},"blockShorts":{{{block_shorts}}},"blockShortsFeed":{{{block_shorts_feed}}},"blockMembersOnly":{{{block_members_only}}},"autoHd":{{{auto_hd}}},"blockGames":{{{block_games}}},"blockVerticalLive":{{{block_vertical_live}}},"jumpAhead":{{{jump_ahead}}},"blockStore":{{{block_store}}},"blockAi":{{{block_ai}}},"onTheGo":{{{on_the_go}}},"backgroundPlay":{{{background_play}}},"pip":{{{pip}}},"hidePremium":{{{hide_premium}}},"preferPremium":{{{prefer_premium}}},"blockPlayerAds":{{{block_player_ads}}},"blockFeedAds":{{{block_feed_ads}}},"blockShortsAds":{{{block_shorts_ads}}},"removePaidPromotion":{{{remove_paid_promotion}}},"blockAdTracking":{{{block_ad_tracking}}},"onTheGoAudio":{{{on_the_go_audio}}},"onTheGoChapters":{{{on_the_go_chapters}}},"stripHotHash":{{{strip_hot_hash}}},"maxSpeed":"{{{max_speed}}}","maxHeight":"{{{max_height}}}","blockGuideItems":"{{{block_guide_items}}}"}'

  # 响应阶段：initplayback 的 UMP 解密 → 改写 → 重新加密（较重，单独给 60 秒）
  - http_response:
      name: "youtube.enhance.ump"
      match: "^https?://[\\w-]+\\.googlevideo\\.com/initplayback(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/xzavier-amico/modules/master/egern/youtube/js/youtube.js"
      body_required: true
      binary_body: true
      max_size: 33554432
      timeout: 60
      env:
        _compat.$argument: '{"blockUpload":{{{block_upload}}},"blockShorts":{{{block_shorts}}},"blockShortsFeed":{{{block_shorts_feed}}},"blockMembersOnly":{{{block_members_only}}},"autoHd":{{{auto_hd}}},"blockGames":{{{block_games}}},"blockVerticalLive":{{{block_vertical_live}}},"jumpAhead":{{{jump_ahead}}},"blockStore":{{{block_store}}},"blockAi":{{{block_ai}}},"onTheGo":{{{on_the_go}}},"backgroundPlay":{{{background_play}}},"pip":{{{pip}}},"hidePremium":{{{hide_premium}}},"preferPremium":{{{prefer_premium}}},"blockPlayerAds":{{{block_player_ads}}},"blockFeedAds":{{{block_feed_ads}}},"blockShortsAds":{{{block_shorts_ads}}},"removePaidPromotion":{{{remove_paid_promotion}}},"blockAdTracking":{{{block_ad_tracking}}},"onTheGoAudio":{{{on_the_go_audio}}},"onTheGoChapters":{{{on_the_go_chapters}}},"stripHotHash":{{{strip_hot_hash}}},"maxSpeed":"{{{max_speed}}}","maxHeight":"{{{max_height}}}","blockGuideItems":"{{{block_guide_items}}}"}'

# ---- URL Rewrite（Surge 的 - reject → respond 404 空响应）----
rewrites:
  - match: "^https://www\\.youtube\\.com/(pagead|pcs)/"
    actions:
      - respond:
          status: 404
  - match: "^https://s\\.youtube\\.com/api/stats/ads"
    actions:
      - respond:
          status: 404

# ---- MITM（Surge [MITM] hostname %APPEND% 直译）----
mitm:
  hostnames:
    includes:
      - "*.googlevideo.com"
      - "youtubei.googleapis.com"
      - "www.youtube.com"
      - "s.youtube.com"
